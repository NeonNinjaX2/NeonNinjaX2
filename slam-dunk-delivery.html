<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slam Dunk">
<title>Slam Dunk Delivery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #14102a;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; --s: 1; }
  canvas { display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: #fff; }
  .box {
    position: absolute; top: calc(var(--s) * 14px);
    background: rgba(20, 16, 42, 0.55);
    border: calc(var(--s) * 3px) solid rgba(255, 255, 255, 0.85);
    border-radius: calc(var(--s) * 12px);
    padding: calc(var(--s) * 6px) calc(var(--s) * 16px);
    text-shadow: 0 calc(var(--s) * 2px) 0 rgba(0,0,0,0.5);
    min-width: calc(var(--s) * 130px);
  }
  .box.left { left: calc(var(--s) * 14px); }
  .box.right { right: calc(var(--s) * 14px); text-align: right; }
  .lbl { font-size: calc(var(--s) * 12px); letter-spacing: calc(var(--s) * 2px); color: #ffd23f; }
  .val { font-size: calc(var(--s) * 30px); line-height: 1.05; }
  #combo { font-size: calc(var(--s) * 13px); color: #7cf7ff; min-height: calc(var(--s) * 15px); }
  #lives {
    position: absolute; top: calc(var(--s) * 18px); left: 50%; transform: translateX(-50%);
    display: flex; gap: calc(var(--s) * 8px); align-items: center;
    font-size: calc(var(--s) * 13px); letter-spacing: calc(var(--s) * 1px);
    text-shadow: 0 calc(var(--s) * 2px) 0 rgba(0,0,0,0.5);
  }
  .pkg {
    width: calc(var(--s) * 22px); height: calc(var(--s) * 18px);
    background: #c8955a; border: calc(var(--s) * 2px) solid #6b4422; border-radius: calc(var(--s) * 3px);
    position: relative;
  }
  .pkg::after { content: ""; position: absolute; left: 40%; top: 0; bottom: 0; width: 20%; background: #e9d3a4; }
  .pkg.lost { opacity: 0.2; }
  #level {
    position: absolute; top: calc(var(--s) * 46px); left: 50%; transform: translateX(-50%);
    font-size: calc(var(--s) * 12px); color: #ffd23f; letter-spacing: calc(var(--s) * 1px);
    text-shadow: 0 calc(var(--s) * 2px) 0 rgba(0,0,0,0.5); white-space: nowrap;
  }
  #hint {
    position: absolute; bottom: calc(var(--s) * 14px); left: 50%; transform: translateX(-50%);
    font-size: calc(var(--s) * 18px); white-space: nowrap;
    background: rgba(20, 16, 42, 0.6); padding: calc(var(--s) * 6px) calc(var(--s) * 18px);
    border-radius: 999px; border: calc(var(--s) * 2px) solid rgba(255,255,255,0.6);
    animation: pulse 1.1s ease-in-out infinite;
  }
  #hint b { color: #ffd23f; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #fff;
    background: rgba(20, 16, 42, 0.55); pointer-events: none;
    text-shadow: 0 calc(var(--s) * 4px) 0 rgba(0,0,0,0.45);
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: calc(var(--s) * 68px); line-height: 0.95; color: #ffd23f;
    -webkit-text-stroke: calc(var(--s) * 3px) #3a1d6e; transform: rotate(-4deg);
  }
  #overlay h1 span { color: #ff5d8f; display: block; }
  #overlay p { margin-top: calc(var(--s) * 14px); font-size: calc(var(--s) * 18px); max-width: 80%; }
  #overlay .big { font-size: calc(var(--s) * 26px); color: #7cf7ff; margin-top: calc(var(--s) * 26px); animation: blink 1s steps(2) infinite; }
  #overlay .small { font-size: calc(var(--s) * 14px); opacity: 0.85; font-family: Arial, sans-serif; font-weight: bold; }
  @keyframes blink { 50% { opacity: 0.35; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="box left"><div class="lbl">SCORE</div><div class="val" id="score">0</div><div id="combo"></div></div>
    <div id="lives"></div>
    <div id="level"></div>
    <div class="box right"><div class="lbl">HIGH SCORE</div><div class="val" id="high">0</div></div>
    <div id="hint"></div>
  </div>
  <div id="overlay"></div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Setup & responsive scaling (desktop + iPad) ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const H = 540;            // fixed logical height; width adapts to screen aspect
  let W = 960, scale = 1, dpr = 1;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    W = Math.round(Math.max(700, Math.min(1300, H * (vw / vh))));
    scale = Math.min(vw / W, vh / H);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    wrap.style.width = cssW + 'px';
    wrap.style.height = cssH + 'px';
    wrap.style.setProperty('--s', Math.max(0.55, scale).toFixed(3));
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  resize();

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  // ---------- Constants ----------
  const GROUND = 470;
  const GRAVITY = 1900;
  const GRAVITY_FLOAT = 1050;   // while holding: driver floats for a longer/higher arc
  const TRUCK_SX = 110;         // truck's screen x
  const SUN_OX = 96;            // sunroof offset inside truck
  const DRIVER_Y = GROUND - 124;
  const PK_OX = 12, PK_OY = -42, PR = 11; // package offset & radius
  const LAUNCH_VX = 330, LAUNCH_VY = -800;
  const BASE_SPEED = 230, SPEED_STEP = 17, MAX_SPEED = 620;
  const WALL = 10;

  // ---------- State ----------
  let state = 'title';     // title | drive | air | result | over
  let tx = 0, camX = 0, speed = BASE_SPEED, level = 0;
  let score = 0, lives = 3, streak = 0, resultT = 0, overT = 0;
  let high = 0;
  try { high = parseInt(localStorage.getItem('slamDunkDeliveryHigh') || '0', 10) || 0; } catch (e) {}
  let holding = false, shake = 0, time = 0, wheelRot = 0;
  let houses = [], active = null;
  let particles = [], texts = [];
  const driver = { mode: 'truck', x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, pop: 1 };
  let lastType = '', sameCount = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Audio (synthesized, no files) ----------
  let actx = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, dur, type = 'square', vol = 0.12, slide = 0, delay = 0) {
    if (!actx) return;
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.25) {
    if (!actx) return;
    const len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    src.buffer = buf; g.gain.value = vol;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  }
  const sfx = {
    launch() { tone(220, 0.25, 'square', 0.1, 660); },
    dunk() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.09, 0, i * 0.07)); noise(0.25, 0.12); },
    swish() { tone(1400, 0.3, 'sine', 0.08, 2600, 0.3); },
    crash() { noise(0.45, 0.35); tone(160, 0.35, 'sawtooth', 0.1, 50); },
    late() { tone(330, 0.2, 'triangle', 0.12, 0); tone(220, 0.35, 'triangle', 0.12, 0, 0.18); },
    over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.12, 0, i * 0.18)); },
  };

  // ---------- Houses ----------
  const WALL_COLORS = ['#f4a261', '#8ecae6', '#e9c46a', '#b5e48c', '#ffafcc', '#cdb4db', '#f28482', '#90e0ef'];
  const ROOF_COLORS = ['#6d2e46', '#3d405b', '#7f4f24', '#264653', '#9d0208', '#5a189a'];

  function roofYAt(h, x) {
    const top = GROUND - h.wallH, peak = top - h.roofH;
    const L = h.x - 14, R = h.x + h.w + 14, mid = h.x + h.w / 2;
    if (x < L || x > R) return Infinity;
    return x <= mid ? top - (x - L) / (mid - L) * (top - peak)
                    : top - (R - x) / (R - mid) * (top - peak);
  }

  function makeHouse(x, lvl) {
    let types = ['chimney', 'window', 'hoop'];
    if (sameCount >= 1) types = types.filter(t => t !== lastType);
    const type = pick(types);
    sameCount = type === lastType ? sameCount + 1 : 0;
    lastType = type;

    const h = {
      x, type,
      w: rand(180, 240) | 0,
      wallH: rand(135, 180) | 0,
      roofH: rand(65, 95) | 0,
      wall: pick(WALL_COLORS), roof: pick(ROOF_COLORS),
      num: 100 + ((Math.random() * 899) | 0),
      open: Math.max(44, 84 - lvl * 3),
      solids: [], netT: 0, scored: false,
    };
    const top = GROUND - h.wallH;

    if (type === 'chimney') {
      h.cw = h.open + WALL * 2;
      h.cx = h.x + h.w * rand(0.55, 0.68);
      if (h.cx + h.cw > h.x + h.w - 8) h.cx = h.x + h.w - 8 - h.cw;
      const baseY = Math.max(roofYAt(h, h.cx), roofYAt(h, h.cx + h.cw));
      const roofTop = Math.min(roofYAt(h, h.cx), roofYAt(h, h.cx + h.cw));
      h.cy = Math.max(GROUND - 320, roofTop - rand(28, 50));
      h.cBase = baseY + 6;
      h.solids.push({ x: h.cx, y: h.cy, w: WALL, h: h.cBase - h.cy });
      h.solids.push({ x: h.cx + h.cw - WALL, y: h.cy, w: WALL, h: h.cBase - h.cy });
      h.solids.push({ x: h.x, y: top, w: h.w, h: h.wallH });
      h.tx = h.cx + h.cw / 2;
    } else if (type === 'window') {
      h.nd = 52;                        // window depth
      h.nh = h.open + 14;               // window opening height
      h.wy = top + rand(16, Math.max(18, h.wallH - h.nh - 34));
      h.solids.push({ x: h.x + h.nd, y: top, w: h.w - h.nd, h: h.wallH });
      h.solids.push({ x: h.x, y: top, w: h.nd, h: h.wy - top });
      h.solids.push({ x: h.x, y: h.wy + h.nh, w: h.nd, h: GROUND - (h.wy + h.nh) });
      h.tx = h.x;
    } else {
      // Driveway hoop on a pole in the front yard
      h.px = h.x - 40;                       // pole x
      h.rimY = GROUND - rand(215, 275);
      h.bbX = h.px - 6;                      // backboard x
      h.rimR = h.bbX - 6;
      h.rimL = h.rimR - (h.open + 14);
      h.solids.push({ x: h.bbX, y: h.rimY - 62, w: 8, h: 80 });        // backboard
      h.solids.push({ x: h.px, y: h.rimY - 40, w: 9, h: GROUND - h.rimY + 40 }); // pole
      h.solids.push({ x: h.rimL - 4, y: h.rimY - 3, w: 7, h: 7 });      // front of rim
      h.solids.push({ x: h.x, y: top, w: h.w, h: h.wallH });
      h.tx = (h.rimL + h.rimR) / 2;
    }
    return h;
  }

  // ---------- Game flow ----------
  function resetWorld() {
    houses = []; particles = []; texts = [];
    lastType = ''; sameCount = 0;
    camX = tx - TRUCK_SX;
    active = makeHouse(camX + W * 0.85, 0);
    houses.push(active);
    driver.mode = 'truck'; driver.pop = 1;
  }

  function start() {
    score = 0; lives = 3; streak = 0; level = 0; speed = BASE_SPEED;
    resetWorld();
    state = 'drive';
    holding = false;
    showOverlay(null);
    updateHud();
  }

  function launch() {
    state = 'air';
    driver.mode = 'air';
    driver.x = tx + SUN_OX;
    driver.y = DRIVER_Y;
    driver.vx = speed + LAUNCH_VX;
    driver.vy = LAUNCH_VY;
    driver.rot = 0;
    sfx.launch();
    for (let i = 0; i < 14; i++) {
      particles.push({ x: driver.x, y: GROUND - 112, vx: rand(-120, 60), vy: rand(-60, 40), life: 0.5, max: 0.5,
        size: rand(6, 12), color: 'rgba(255,255,255,0.8)', type: 'puff', g: -40 });
    }
  }

  function endRound(t) { state = 'result'; resultT = t; }

  function nextRound() {
    if (lives <= 0) { gameOver(); return; }
    level++;
    speed = Math.min(MAX_SPEED, BASE_SPEED + level * SPEED_STEP);
    const last = houses[houses.length - 1];
    const nx = Math.max(camX + W + 90, last.x + last.w + 230);
    active = makeHouse(nx, level);
    houses.push(active);
    houses = houses.filter(h => h.x + h.w > camX - 300);
    driver.mode = 'truck'; driver.pop = 0;
    state = 'drive';
    updateHud();
  }

  function gameOver() {
    state = 'over'; overT = 0;
    sfx.over();
    const isNew = score > 0 && score >= high;
    showOverlay(`
      <h1>ROUTE<span>COMPLETE</span></h1>
      <p>Final score: <b style="color:#ffd23f">${score}</b>${isNew ? '<br><span style="color:#7cf7ff">NEW HIGH SCORE!</span>' : ''}</p>
      <div class="big">${isTouch ? 'TAP' : 'PRESS SPACE'} TO PLAY AGAIN</div>`);
  }

  function addText(text, wx, wy, color, size, life = 1.3) {
    texts.push({ text, x: wx - camX, y: wy, color, size, t: 0, max: life, rot: rand(-0.12, 0.12) });
  }

  function dunk(offset, half, x, y) {
    const h = active;
    h.scored = true; h.netT = 1;
    const perfect = Math.abs(offset) < half * 0.35;
    streak++;
    const mult = Math.min(5, streak);
    const pts = (100 + (perfect ? 50 : 0)) * mult;
    score += pts;
    if (score > high) { high = score; try { localStorage.setItem('slamDunkDeliveryHigh', String(high)); } catch (e) {} }
    driver.mode = 'gone';
    addText('SLAM DUNK!', camX + W / 2, 200, '#ffd23f', 76, 1.5);
    if (perfect) addText('SWISH!', x, y - 70, '#7cf7ff', 36, 1.2);
    addText('+' + pts + (mult > 1 ? `  x${mult}` : ''), x, y - 30, '#ffffff', 30, 1.2);
    // confetti explosion
    const cols = ['#ff5d8f', '#ffd23f', '#7cf7ff', '#8bff6b', '#b388ff', '#ff8c42', '#ffffff'];
    for (let i = 0; i < 160; i++) {
      const a = rand(-Math.PI, 0), s = rand(150, 720);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: rand(1.6, 2.8), max: 2.8,
        size: rand(5, 10), color: pick(cols), type: 'confetti', rot: rand(0, 6), vr: rand(-14, 14), g: 650, drag: 0.985 });
    }
    for (let i = 0; i < 26; i++) {
      const a = rand(0, Math.PI * 2), s = rand(60, 260);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6,
        size: rand(3, 6), color: '#fff6c2', type: 'spark', g: 0, drag: 0.92 });
    }
    particles.push({ x, y, life: 0.5, max: 0.5, type: 'ring', size: 10, color: '#ffd23f' });
    shake = 14;
    sfx.dunk(); if (perfect) sfx.swish();
    endRound(1.5);
    updateHud();
  }

  function crash(px, py, label) {
    streak = 0; lives--;
    const cols = ['#c8955a', '#a8743f', '#e9d3a4', '#8a5a2b', '#f5f0e1'];
    for (let i = 0; i < 46; i++) {
      const a = rand(0, Math.PI * 2), s = rand(80, 520);
      particles.push({ x: px, y: py, vx: Math.cos(a) * s - 80, vy: Math.sin(a) * s - 200, life: rand(1.2, 2.2), max: 2.2,
        size: rand(4, 12), color: pick(cols), type: 'debris', rot: rand(0, 6), vr: rand(-12, 12), g: 1500, drag: 0.995, bounce: true });
    }
    for (let i = 0; i < 12; i++) {
      particles.push({ x: px, y: py, vx: rand(-90, 90), vy: rand(-90, 30), life: 0.7, max: 0.7,
        size: rand(10, 20), color: 'rgba(120,100,80,0.55)', type: 'puff', g: -30 });
    }
    particles.push({ x: px, y: py, life: 0.35, max: 0.35, type: 'ring', size: 8, color: '#ff8c42' });
    addText(label, px, py - 40, '#ff5d8f', 46, 1.2);
    driver.mode = 'ragdoll';
    driver.vx = -170; driver.vy = -380; driver.vr = 9;
    shake = 10;
    sfx.crash();
    endRound(1.4);
    updateHud();
  }

  function tooLate() {
    streak = 0; lives--;
    addText('TOO LATE!', tx + SUN_OX + 60, DRIVER_Y - 60, '#ff5d8f', 44, 1.2);
    sfx.late();
    endRound(1.1);
    updateHud();
  }

  // ---------- Collision ----------
  function circleRect(cx, cy, r, s) {
    const nx = clamp(cx, s.x, s.x + s.w), ny = clamp(cy, s.y, s.y + s.h);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function checkPackage(ppx, ppy, px, py) {
    const h = active;
    // ---- scoring ----
    if (h.type === 'chimney') {
      if (ppy < h.cy && py >= h.cy) {
        const ix = ppx + (px - ppx) * (h.cy - ppy) / (py - ppy);
        if (ix > h.cx + WALL + 2 && ix < h.cx + h.cw - WALL - 2) {
          dunk(ix - (h.cx + h.cw / 2), (h.cw - WALL * 2) / 2, ix, h.cy); return true;
        }
      }
    } else if (h.type === 'window') {
      if (px > h.x + 10 && px < h.x + h.nd && py > h.wy + PR * 0.6 && py < h.wy + h.nh - PR * 0.6) {
        dunk(py - (h.wy + h.nh / 2), h.nh / 2, h.x + 20, h.wy + h.nh / 2); return true;
      }
    } else {
      if (ppy < h.rimY && py >= h.rimY) {
        const ix = ppx + (px - ppx) * (h.rimY - ppy) / (py - ppy);
        if (ix > h.rimL + 2 && ix < h.rimR - 2) {
          dunk(ix - (h.rimL + h.rimR) / 2, (h.rimR - h.rimL) / 2, ix, h.rimY); return true;
        }
      }
    }
    // ---- crashes ----
    for (const hs of houses) {
      for (const s of hs.solids) {
        if (circleRect(px, py, PR, s)) {
          crash(px, py, hs.type === 'hoop' && s.h < 90 && s.w < 10 ? 'BRICK!' : 'SPLAT!'); return true;
        }
      }
      const ry = roofYAt(hs, px);
      if (ry !== Infinity && py + PR * 0.8 > ry && py < GROUND - hs.wallH + 10) {
        crash(px, py, 'SPLAT!'); return true;
      }
    }
    if (py + PR >= GROUND) { crash(px, GROUND - PR, 'MISSED!'); return true; }
    return false;
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    const sp = (state === 'title' || state === 'over') ? 140 : speed;
    tx += sp * dt;
    camX = tx - TRUCK_SX;
    wheelRot += sp * dt / 17;
    if (state === 'over') overT += dt;

    // keep attract-mode scenery flowing
    if (state === 'title' || state === 'over') {
      const last = houses[houses.length - 1];
      if (!last || last.x < camX + W) houses.push(makeHouse((last ? last.x + last.w : camX + W) + rand(260, 420), 0));
      houses = houses.filter(h => h.x + h.w > camX - 300);
    }

    // exhaust
    if (Math.random() < dt * 18) {
      particles.push({ x: tx - 4, y: GROUND - 22, vx: rand(-70, -30), vy: rand(-40, -15), life: 0.7, max: 0.7,
        size: rand(5, 10), color: 'rgba(180,180,200,0.5)', type: 'puff', g: -20 });
    }

    // driver
    if (driver.mode === 'truck') {
      driver.pop = Math.min(1, driver.pop + dt * 4);
      driver.x = tx + SUN_OX; driver.y = DRIVER_Y + (1 - driver.pop) * 40;
    } else if (driver.mode === 'air') {
      const steps = 3, h = dt / steps;
      for (let i = 0; i < steps && driver.mode === 'air'; i++) {
        const ppx = driver.x + PK_OX, ppy = driver.y + PK_OY;
        driver.vy += (holding ? GRAVITY_FLOAT : GRAVITY) * h;
        driver.x += driver.vx * h; driver.y += driver.vy * h;
        driver.rot = clamp(driver.vy / 2200, -0.35, 0.45);
        checkPackage(ppx, ppy, driver.x + PK_OX, driver.y + PK_OY);
      }
      if (driver.mode === 'air' && Math.random() < dt * 40) {
        particles.push({ x: driver.x - 10, y: driver.y + 10, vx: -60, vy: 0, life: 0.35, max: 0.35,
          size: holding ? 7 : 4, color: holding ? 'rgba(124,247,255,0.7)' : 'rgba(255,255,255,0.5)', type: 'puff', g: 0 });
      }
    } else if (driver.mode === 'ragdoll') {
      driver.vy += GRAVITY * dt; driver.x += driver.vx * dt; driver.y += driver.vy * dt; driver.rot += driver.vr * dt;
      if (driver.y > H + 120) driver.mode = 'gone';
    }

    // round logic
    if (state === 'drive' && active && active.tx < tx + SUN_OX + 4) tooLate();
    if (state === 'result') {
      resultT -= dt;
      if (resultT <= 0 && driver.mode !== 'ragdoll') nextRound();
    }

    for (const h of houses) if (h.netT > 0) h.netT = Math.max(0, h.netT - dt * 1.6);

    // particles
    for (const p of particles) {
      p.life -= dt;
      if (p.type === 'ring') { p.size += 520 * dt; continue; }
      p.vy += (p.g || 0) * dt;
      if (p.drag) { p.vx *= Math.pow(p.drag, dt * 60); p.vy *= Math.pow(p.drag, dt * 60); }
      if (p.type === 'confetti') p.vx += Math.sin(time * 8 + p.rot) * 40 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vr) p.rot += p.vr * dt;
      if (p.bounce && p.y > GROUND - 2) { p.y = GROUND - 2; p.vy *= -0.35; p.vx *= 0.7; p.vr *= 0.6; }
    }
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 700) particles.splice(0, particles.length - 700);

    for (const t of texts) t.t += dt;
    texts = texts.filter(t => t.t < t.max);

    shake = Math.max(0, shake - dt * 40);
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    const hue = (level * 9) % 60;
    g.addColorStop(0, `hsl(${215 + hue * 0.3}, 70%, 52%)`);
    g.addColorStop(0.65, `hsl(${280 + hue}, 60%, 72%)`);
    g.addColorStop(1, `hsl(${20 + hue * 0.4}, 90%, 78%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);

    // sun
    ctx.fillStyle = 'rgba(255, 236, 150, 0.9)';
    ctx.beginPath(); ctx.arc(W * 0.78, 120, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 236, 150, 0.25)';
    ctx.beginPath(); ctx.arc(W * 0.78, 120, 70, 0, Math.PI * 2); ctx.fill();

    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const cOff = camX * 0.08;
    for (let i = 0; i < 7; i++) {
      const span = W + 300;
      const x = ((i * 260 - cOff) % span + span) % span - 150;
      const y = 50 + (i * 53) % 130;
      const s = 0.7 + (i % 3) * 0.25;
      ctx.beginPath();
      ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
      ctx.arc(x + 26 * s, y - 10 * s, 26 * s, 0, Math.PI * 2);
      ctx.arc(x + 56 * s, y, 20 * s, 0, Math.PI * 2);
      ctx.rect(x, y, 56 * s, 20 * s);
      ctx.fill();
    }

    // hills (parallax)
    const layers = [[0.2, '#7b6fc4', 130, 0.004], [0.4, '#5b9a8b', 80, 0.007]];
    for (const [f, col, amp, freq] of layers) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, GROUND);
      for (let x = 0; x <= W + 10; x += 10) {
        const wx = x + camX * f;
        ctx.lineTo(x, GROUND - 40 - amp * (0.5 + 0.5 * Math.sin(wx * freq) * Math.cos(wx * freq * 0.37)));
      }
      ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
    }
  }

  function drawTrees() {
    const spacing = 170;
    const startI = Math.floor((camX - 100) / spacing), endI = Math.floor((camX + W + 100) / spacing);
    for (let i = startI; i <= endI; i++) {
      const hsh = Math.abs(Math.sin(i * 127.1) * 43758.5453) % 1;
      if (hsh < 0.45) continue;
      const x = i * spacing + hsh * 80;
      const s = 0.7 + hsh * 0.5;
      ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x - 5 * s, GROUND - 50 * s, 10 * s, 50 * s);
      ctx.fillStyle = hsh > 0.7 ? '#2d6a4f' : '#40916c';
      ctx.beginPath();
      ctx.arc(x, GROUND - 70 * s, 30 * s, 0, Math.PI * 2);
      ctx.arc(x - 20 * s, GROUND - 52 * s, 22 * s, 0, Math.PI * 2);
      ctx.arc(x + 20 * s, GROUND - 52 * s, 22 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHouse(h) {
    const top = GROUND - h.wallH, peak = top - h.roofH;
    const isActive = h === active && (state === 'drive' || state === 'air');

    // chimney (behind roof)
    if (h.type === 'chimney') {
      ctx.fillStyle = '#9b2226';
      ctx.fillRect(h.cx, h.cy, h.cw, h.cBase - h.cy);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
      for (let y = h.cy + 10; y < h.cBase; y += 10) {
        ctx.beginPath(); ctx.moveTo(h.cx, y); ctx.lineTo(h.cx + h.cw, y); ctx.stroke();
        const off = ((y - h.cy) / 10) % 2 ? 0 : h.cw / 4;
        for (let x = h.cx + off + h.cw / 4; x < h.cx + h.cw; x += h.cw / 2) {
          ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y); ctx.stroke();
        }
      }
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(h.cx + WALL, h.cy, h.cw - WALL * 2, 14);
      ctx.fillStyle = '#6b1a1d';
      ctx.fillRect(h.cx - 4, h.cy - 6, WALL + 4, 8);
      ctx.fillRect(h.cx + h.cw - WALL, h.cy - 6, WALL + 4, 8);
    }

    // walls
    ctx.fillStyle = h.wall;
    if (h.type === 'window') {
      ctx.fillRect(h.x + h.nd, top, h.w - h.nd, h.wallH);
      ctx.fillRect(h.x, top, h.nd, h.wy - top);
      ctx.fillRect(h.x, h.wy + h.nh, h.nd, GROUND - h.wy - h.nh);
    } else {
      ctx.fillRect(h.x, top, h.w, h.wallH);
    }
    // siding lines
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 2;
    for (let y = top + 14; y < GROUND; y += 14) {
      ctx.beginPath();
      if (h.type === 'window' && y > h.wy && y < h.wy + h.nh) ctx.moveTo(h.x + h.nd, y); else ctx.moveTo(h.x, y);
      ctx.lineTo(h.x + h.w, y); ctx.stroke();
    }

    // open window target
    if (h.type === 'window') {
      const g = ctx.createLinearGradient(h.x, 0, h.x + h.nd, 0);
      g.addColorStop(0, '#2b2140'); g.addColorStop(1, '#120c22');
      ctx.fillStyle = g; ctx.fillRect(h.x, h.wy, h.nd, h.nh);
      ctx.fillStyle = 'rgba(255, 210, 120, 0.25)';
      ctx.fillRect(h.x + h.nd - 14, h.wy + 6, 10, h.nh - 12);
      // curtains
      ctx.fillStyle = '#e63946';
      ctx.beginPath(); ctx.moveTo(h.x + h.nd, h.wy); ctx.lineTo(h.x + h.nd - 16, h.wy);
      ctx.quadraticCurveTo(h.x + h.nd - 4, h.wy + h.nh * 0.5, h.x + h.nd - 10, h.wy + h.nh); ctx.lineTo(h.x + h.nd, h.wy + h.nh); ctx.fill();
      // frame & sill
      ctx.fillStyle = '#fff';
      ctx.fillRect(h.x - 4, h.wy - 8, h.nd + 8, 8);
      ctx.fillRect(h.x - 8, h.wy + h.nh, h.nd + 12, 8);
      // flower box
      ctx.fillStyle = '#7f4f24'; ctx.fillRect(h.x - 6, h.wy + h.nh + 8, h.nd + 8, 10);
      ['#ff5d8f', '#ffd23f', '#ff8c42', '#ff5d8f'].forEach((c, i) => {
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(h.x + 4 + i * 13, h.wy + h.nh + 6, 4, 0, Math.PI * 2); ctx.fill();
      });
    }

    // decorative windows & door
    const doorX = h.x + h.w - 54;
    ctx.fillStyle = '#5c3d2e'; ctx.fillRect(doorX, GROUND - 62, 34, 62);
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(doorX + 27, GROUND - 30, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(doorX - 3, GROUND - 66, 40, 5);
    const winX = h.x + (h.type === 'window' ? h.nd + 22 : 26);
    if (winX + 44 < doorX - 10) {
      ctx.fillStyle = '#fff'; ctx.fillRect(winX - 4, top + 26, 52, 48);
      ctx.fillStyle = '#a8dadc'; ctx.fillRect(winX, top + 30, 44, 40);
      ctx.fillStyle = '#fff'; ctx.fillRect(winX + 20, top + 30, 4, 40); ctx.fillRect(winX, top + 48, 44, 4);
    }
    // house number
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
    ctx.fillText(h.num, doorX + 17, GROUND - 72);

    // roof
    ctx.fillStyle = h.roof;
    ctx.beginPath(); ctx.moveTo(h.x - 14, top); ctx.lineTo(h.x + h.w / 2, peak); ctx.lineTo(h.x + h.w + 14, top); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    for (let i = 1; i < 5; i++) {
      const y = top - (top - peak) * i / 5;
      const half = (h.w / 2 + 14) * (1 - i / 5);
      ctx.beginPath(); ctx.moveTo(h.x + h.w / 2 - half, y); ctx.lineTo(h.x + h.w / 2 + half, y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(h.x - 14, top, h.w + 28, 5);

    // driveway hoop
    if (h.type === 'hoop') {
      ctx.fillStyle = '#555'; ctx.fillRect(h.px, h.rimY - 40, 9, GROUND - h.rimY + 40);
      ctx.fillStyle = '#fff'; ctx.fillRect(h.bbX, h.rimY - 62, 8, 80);
      ctx.strokeStyle = '#e63946'; ctx.lineWidth = 2; ctx.strokeRect(h.bbX + 1, h.rimY - 38, 6, 28);
      // net
      const sw = Math.sin(h.netT * 20) * h.netT * 8;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5;
      const nb = h.rimY + 34 + h.netT * 14;
      const n = 5;
      for (let i = 0; i <= n; i++) {
        const x0 = h.rimL + (h.rimR - h.rimL) * i / n;
        const x1 = h.rimL + 8 + (h.rimR - h.rimL - 16) * i / n + sw;
        ctx.beginPath(); ctx.moveTo(x0, h.rimY); ctx.lineTo(x1, nb); ctx.stroke();
      }
      for (let j = 1; j <= 3; j++) {
        const y = h.rimY + (nb - h.rimY) * j / 3, ins = 8 * j / 3;
        ctx.beginPath(); ctx.moveTo(h.rimL + ins + sw * j / 3, y); ctx.lineTo(h.rimR - ins + sw * j / 3, y); ctx.stroke();
      }
      ctx.strokeStyle = '#ff6b1a'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(h.rimL, h.rimY); ctx.lineTo(h.bbX, h.rimY); ctx.stroke();
    }

    // mailbox
    const mx = h.x + h.w + 30;
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(mx, GROUND - 34, 5, 34);
    ctx.fillStyle = '#3d5a80'; roundRect(mx - 10, GROUND - 48, 26, 16, 6); ctx.fill();
    ctx.fillStyle = '#e63946'; ctx.fillRect(mx + 14, GROUND - 58, 3, 14);

    // target marker
    if (isActive) {
      const bob = Math.sin(time * 8) * 6;
      ctx.save();
      ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#3a1d6e'; ctx.lineWidth = 3;
      let ax, ay, dir;
      if (h.type === 'chimney') { ax = h.cx + h.cw / 2; ay = h.cy - 40 + bob; dir = 'down'; }
      else if (h.type === 'hoop') { ax = (h.rimL + h.rimR) / 2; ay = h.rimY - 44 + bob; dir = 'down'; }
      else { ax = h.x - 34 + bob; ay = h.wy + h.nh / 2; dir = 'right'; }
      ctx.translate(ax, ay);
      if (dir === 'right') ctx.rotate(-Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(-8, -18); ctx.lineTo(8, -18); ctx.lineTo(8, -2); ctx.lineTo(16, -2);
      ctx.lineTo(0, 14); ctx.lineTo(-16, -2); ctx.lineTo(-8, -2); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function drawPackage(x, y, rot = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#c8955a'; ctx.strokeStyle = '#6b4422'; ctx.lineWidth = 2;
    roundRect(-PR, -PR + 1, PR * 2, PR * 2 - 2, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e9d3a4'; ctx.fillRect(-3, -PR + 1, 6, PR * 2 - 2);
    ctx.fillStyle = '#e63946'; ctx.fillRect(-PR + 3, 2, 6, 4);
    ctx.restore();
  }

  function drawDriver(x, y, rot, pose) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const skin = '#f1c27d', uni = '#7a4b23', dark = '#4a2c12';
    // legs
    ctx.strokeStyle = dark; ctx.lineWidth = 7; ctx.lineCap = 'round';
    const kick = pose === 'air' ? Math.sin(time * 18) * 6 : 0;
    ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(-10 - kick, 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 12); ctx.lineTo(10 + kick, 28); ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.fillRect(-15 - kick, 28, 9, 5); ctx.fillRect(7 + kick, 26, 9, 5);
    // torso
    ctx.fillStyle = uni; roundRect(-10, -14, 20, 28, 6); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-10, 2, 20, 3);
    // arms up to package
    ctx.strokeStyle = uni; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-7, -10); ctx.lineTo(PK_OX - 9, PK_OY + 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, -10); ctx.lineTo(PK_OX + 9, PK_OY + 8); ctx.stroke();
    // head
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(2, -24, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(6, -25, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (pose === 'ragdoll') { ctx.arc(6, -19, 2.5, 0, Math.PI * 2); }
    else { ctx.arc(5, -22, 3.5, 0.2, Math.PI - 0.6); }
    ctx.stroke();
    // cap
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(2, -27, 9, Math.PI, 0); ctx.fill();
    ctx.fillRect(4, -29, 11, 3);
    ctx.restore();
    if (pose !== 'ragdoll') {
      // package held above head (rotates with body)
      const c = Math.cos(rot), s = Math.sin(rot);
      drawPackage(x + PK_OX * c - PK_OY * s, y + PK_OX * s + PK_OY * c, rot);
    }
  }

  function drawTruck() {
    const x = tx, bob = Math.sin(time * 22) * 1.2;
    const by = GROUND - 110 + bob;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x + 90, GROUND + 2, 95, 7, 0, 0, Math.PI * 2); ctx.fill();
    // cargo box
    ctx.fillStyle = '#7a4b23'; roundRect(x, by, 128, 92, 6); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x, by + 56, 128, 8);
    ctx.fillStyle = '#5c3a1a'; ctx.fillRect(x + 4, by + 8, 3, 76);
    // logo
    ctx.save(); ctx.translate(x + 30, by + 30);
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a4b23'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.moveTo(-17, 0); ctx.lineTo(17, 0);
    ctx.moveTo(0, -17); ctx.quadraticCurveTo(-8, 0, 0, 17); ctx.moveTo(0, -17); ctx.quadraticCurveTo(8, 0, 0, 17); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = '900 11px "Arial Black", Arial, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('SLAM DUNK', x + 84, by + 27); ctx.fillText('DELIVERY', x + 84, by + 42);
    // cab
    ctx.fillStyle = '#8c5a2c';
    ctx.beginPath(); ctx.moveTo(x + 126, by + 92); ctx.lineTo(x + 126, by + 18); ctx.lineTo(x + 158, by + 18);
    ctx.lineTo(x + 182, by + 52); ctx.lineTo(x + 186, by + 92); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a8dadc';
    ctx.beginPath(); ctx.moveTo(x + 136, by + 26); ctx.lineTo(x + 156, by + 26); ctx.lineTo(x + 174, by + 52); ctx.lineTo(x + 136, by + 52); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x + 140, by + 30, 5, 18);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x + 126, by + 56, 60, 8);
    ctx.fillStyle = '#fff6c2'; ctx.fillRect(x + 180, by + 68, 7, 10);
    ctx.fillStyle = '#333'; ctx.fillRect(x + 176, by + 86, 14, 8);
    // sunroof
    ctx.fillStyle = '#2b1a0c'; ctx.fillRect(x + SUN_OX - 18, by - 3, 36, 6);
    ctx.fillStyle = '#5c3a1a'; ctx.fillRect(x + SUN_OX - 24, by - 6, 8, 6);
    // wheels
    for (const wx of [x + 34, x + 150]) {
      ctx.save(); ctx.translate(wx, GROUND - 17);
      ctx.fillStyle = '#1d1d1d'; ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#bbb'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(wheelRot); ctx.strokeStyle = '#555'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
      ctx.restore();
    }
    // speed lines
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const len = 20 + speed / 18, yy = by + 20 + i * 24, off = ((time * speed * 0.6 + i * 40) % 60);
      ctx.beginPath(); ctx.moveTo(x - 12 - off, yy); ctx.lineTo(x - 12 - off - len, yy); ctx.stroke();
    }
  }

  function drawGround() {
    ctx.fillStyle = '#4caf50'; ctx.fillRect(camX - 10, GROUND, W + 20, 14);
    ctx.fillStyle = '#c9c3b6'; ctx.fillRect(camX - 10, GROUND + 14, W + 20, 10);
    ctx.fillStyle = '#3a3a48'; ctx.fillRect(camX - 10, GROUND + 24, W + 20, H - GROUND);
    ctx.fillStyle = '#ffd23f';
    const start = Math.floor(camX / 80) * 80;
    for (let x = start; x < camX + W + 80; x += 80) ctx.fillRect(x, GROUND + 44, 44, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let x = Math.floor(camX / 40) * 40; x < camX + W + 40; x += 40) ctx.fillRect(x, GROUND + 14, 2, 10);
  }

  function drawPrediction() {
    // dotted guide arc for the first few houses
    if (state !== 'drive' || level > 2) return;
    let x = tx + SUN_OX + PK_OX, y = DRIVER_Y + PK_OY, vx = speed + LAUNCH_VX, vy = LAUNCH_VY;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    for (let i = 0; i < 90; i++) {
      const h = 1 / 60;
      vy += GRAVITY * h; x += vx * h; y += vy * h;
      if (y > GROUND) break;
      if (i % 4 === 0) { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = p.type === 'confetti' ? Math.min(1, a * 2) : a;
      if (p.type === 'ring') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 6 * a;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke();
      } else if (p.type === 'confetti' || p.type === 'debris') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        const w = p.type === 'confetti' ? p.size * Math.abs(Math.cos(p.rot * 1.7)) + 1 : p.size;
        ctx.fillRect(-w / 2, -p.size * 0.3, w, p.size * (p.type === 'confetti' ? 0.6 : 0.8));
        ctx.restore();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.type === 'puff' ? (1.6 - a * 0.6) : 1), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawTexts() {
    for (const t of texts) {
      const k = t.t / t.max;
      let s;
      if (t.t < 0.18) { const u = t.t / 0.18; s = u * (1.5 - 0.5 * u) * 1.25; }
      else s = 1 + Math.sin(t.t * 14) * 0.03;
      ctx.save();
      ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      ctx.translate(t.x, t.y - t.t * 30);
      ctx.rotate(t.rot + Math.sin(t.t * 10) * 0.03);
      ctx.scale(s, s);
      ctx.font = `900 ${t.size}px "Arial Black", Impact, Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = t.size * 0.22; ctx.strokeStyle = '#3a1d6e'; ctx.strokeText(t.text, 0, 0);
      ctx.fillStyle = t.color; ctx.fillText(t.text, 0, 0);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillText(t.text, 0, -t.size * 0.06);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const sx = shake ? rand(-shake, shake) * 0.6 : 0, sy = shake ? rand(-shake, shake) * 0.6 : 0;
    ctx.save();
    ctx.translate(sx, sy);
    drawSky();

    ctx.save();
    ctx.translate(-camX, 0);
    drawTrees();
    for (const h of houses) if (h.x < camX + W + 100 && h.x + h.w > camX - 160) drawHouse(h);
    drawGround();
    drawPrediction();
    if (driver.mode === 'truck' && state !== 'title' && state !== 'over') drawDriver(driver.x, driver.y, 0, 'truck');
    drawTruck();
    if (driver.mode === 'air') drawDriver(driver.x, driver.y, driver.rot, 'air');
    if (driver.mode === 'ragdoll') drawDriver(driver.x, driver.y, driver.rot, 'ragdoll');
    drawParticles();
    ctx.restore();

    drawTexts();
    ctx.restore();
  }

  // ---------- HUD ----------
  const $score = document.getElementById('score'), $high = document.getElementById('high');
  const $combo = document.getElementById('combo'), $lives = document.getElementById('lives');
  const $hint = document.getElementById('hint'), $level = document.getElementById('level');
  const $overlay = document.getElementById('overlay');

  function updateHud() {
    $score.textContent = score;
    $high.textContent = high;
    $combo.textContent = streak > 1 ? `STREAK x${Math.min(5, streak)}` : '';
    let l = '';
    for (let i = 0; i < 3; i++) l += `<div class="pkg${i >= lives ? ' lost' : ''}"></div>`;
    $lives.innerHTML = l;
    $level.textContent = state === 'title' ? '' : `HOUSE ${level + 1} · ${Math.round(speed / 6)} MPH`;
    $hint.innerHTML = isTouch
      ? '<b>TAP</b> to Dunk · <b>HOLD</b> to float'
      : 'Press <b>SPACE</b> to Dunk · <b>HOLD</b> to float';
  }

  function showOverlay(html) {
    $hint.style.display = html ? 'none' : '';
    if (!html) { $overlay.classList.add('hidden'); return; }
    $overlay.innerHTML = html;
    $overlay.classList.remove('hidden');
  }

  // ---------- Input (keyboard + touch / pointer) ----------
  function press() {
    unlockAudio();
    if (state === 'title') { start(); return; }
    if (state === 'over') { if (overT > 0.8) start(); return; }
    if (state === 'drive') launch();
    holding = true;
  }
  function release() { holding = false; }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); release(); }
  });

  const activePointers = new Set();
  window.addEventListener('pointerdown', e => {
    e.preventDefault();
    const first = activePointers.size === 0;
    activePointers.add(e.pointerId);
    if (first) press();
  }, { passive: false });
  const up = e => { activePointers.delete(e.pointerId); if (activePointers.size === 0) release(); };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  // block iOS Safari scroll / pinch / double-tap zoom / callouts
  ['touchstart', 'touchmove', 'touchend'].forEach(t => window.addEventListener(t, e => e.preventDefault(), { passive: false }));
  ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu'].forEach(t => window.addEventListener(t, e => e.preventDefault()));
  window.addEventListener('blur', () => { activePointers.clear(); release(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { activePointers.clear(); release(); } });

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resetWorld();
  updateHud();
  showOverlay(`
    <h1>SLAM DUNK<span>DELIVERY</span></h1>
    <p>Launch the driver out of the sunroof and dunk the package into the chimney, the open window or the driveway hoop.</p>
    <p class="small">Time your launch &middot; hold to float &middot; miss 3 deliveries and your route is over</p>
    <div class="big">${isTouch ? 'TAP' : 'PRESS SPACE'} TO START</div>`);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
