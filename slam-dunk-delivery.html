<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slam Dunk">
<title>Slam Dunk Delivery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0d0f12;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; --s: 1; }
  canvas { display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: #fff; }
  .panel {
    position: absolute; top: calc(var(--s) * 14px);
    background: linear-gradient(180deg, rgba(18, 22, 28, 0.72), rgba(10, 12, 16, 0.6));
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: calc(var(--s) * 10px);
    padding: calc(var(--s) * 7px) calc(var(--s) * 14px) calc(var(--s) * 6px);
    box-shadow: 0 calc(var(--s) * 6px) calc(var(--s) * 18px) rgba(0, 0, 0, 0.35);
    min-width: calc(var(--s) * 120px);
  }
  .panel.left { left: calc(var(--s) * 14px); }
  .panel.right { right: calc(var(--s) * 14px); text-align: right; }
  .lbl { font-size: calc(var(--s) * 10px); letter-spacing: calc(var(--s) * 2.2px); font-weight: 600; color: rgba(255,255,255,0.6); }
  .val { font-size: calc(var(--s) * 30px); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  #combo { font-size: calc(var(--s) * 11px); font-weight: 700; color: #f2c14e; letter-spacing: calc(var(--s) * 1px); min-height: calc(var(--s) * 13px); }
  #center {
    position: absolute; top: calc(var(--s) * 14px); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--s) * 6px);
    padding: calc(var(--s) * 8px) calc(var(--s) * 14px);
  }
  #lives { display: flex; gap: calc(var(--s) * 7px); }
  .pkg {
    width: calc(var(--s) * 20px); height: calc(var(--s) * 16px); border-radius: 2px; position: relative;
    background: linear-gradient(180deg, #d4a56b, #a87843);
    box-shadow: inset 0 0 0 1px rgba(80, 50, 20, 0.6), 0 2px 4px rgba(0,0,0,0.4);
  }
  .pkg::after { content: ""; position: absolute; left: 42%; top: 0; bottom: 0; width: 16%; background: rgba(235, 222, 190, 0.85); }
  .pkg.lost { opacity: 0.18; }
  #level { font-size: calc(var(--s) * 11px); font-weight: 600; color: rgba(255,255,255,0.75); letter-spacing: calc(var(--s) * 1.5px); white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  #hint {
    position: absolute; bottom: calc(var(--s) * 12px); left: 50%; transform: translateX(-50%);
    font-size: calc(var(--s) * 15px); font-weight: 500; white-space: nowrap; color: rgba(255,255,255,0.92);
    background: rgba(10, 12, 16, 0.55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    padding: calc(var(--s) * 7px) calc(var(--s) * 18px);
    border-radius: 999px; border: 1px solid rgba(255,255,255,0.2);
    animation: pulse 1.6s ease-in-out infinite;
  }
  #hint b { color: #f2c14e; font-weight: 700; }
  @keyframes pulse { 50% { opacity: 0.7; } }
  .ui { pointer-events: auto; }
  #gear {
    position: absolute; right: calc(var(--s) * 14px); bottom: calc(var(--s) * 12px);
    width: calc(var(--s) * 44px); height: calc(var(--s) * 44px); border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(10,12,16,0.6); color: #fff;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-size: calc(var(--s) * 22px); line-height: 1; cursor: pointer; z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }
  #home {
    position: absolute; left: calc(var(--s) * 14px); bottom: calc(var(--s) * 12px); z-index: 5;
    height: calc(var(--s) * 44px); padding: 0 calc(var(--s) * 16px); border-radius: 999px;
    display: flex; align-items: center; text-decoration: none; color: #fff; font-weight: 600;
    font-size: calc(var(--s) * 14px); letter-spacing: 0.3px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(10,12,16,0.6);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #settings {
    position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: calc(var(--s) * 10px);
    background: linear-gradient(180deg, rgba(6,8,12,0) 40%, rgba(6,8,12,0.45));
  }
  #wrap.settings-open #overlay, #wrap.settings-open #hint { display: none !important; }
  #settings.hidden { display: none; }
  #settings .card {
    width: min(96%, calc(var(--s) * 780px)); max-height: 60%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, rgba(22,26,33,0.94), rgba(12,14,18,0.94));
    border: 1px solid rgba(255,255,255,0.18); border-radius: calc(var(--s) * 14px);
    padding: calc(var(--s) * 12px) calc(var(--s) * 18px); color: #fff;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(var(--s) * 26px);
    box-shadow: 0 calc(var(--s) * 12px) calc(var(--s) * 40px) rgba(0,0,0,0.5);
    font-size: calc(var(--s) * 14px);
  }
  #settings h3 { font-size: calc(var(--s) * 13px); letter-spacing: calc(var(--s) * 3px); color: #f2c14e; font-weight: 700; margin: calc(var(--s) * 10px) 0 calc(var(--s) * 4px); }
  #settings .col > h3:first-child { margin-top: 0; }
  #settings .row { padding: calc(var(--s) * 3px) 0; }
  #settings .full { grid-column: 1 / -1; }
  #settings .row .top { display: flex; justify-content: space-between; color: rgba(255,255,255,0.85); }
  #settings .row .top span:last-child { font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
  #settings input[type=range] {
    width: 100%; margin-top: calc(var(--s) * 2px); height: calc(var(--s) * 26px);
    accent-color: #f2c14e; touch-action: pan-x;
  }
  #settings .seg { display: flex; gap: calc(var(--s) * 6px); margin-top: calc(var(--s) * 6px); }
  #settings button {
    flex: 1; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    padding: calc(var(--s) * 9px) calc(var(--s) * 10px); border-radius: calc(var(--s) * 8px);
    border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.06);
  }
  #settings button.on { background: #f2c14e; color: #1a1408; border-color: #f2c14e; }
  #settings .actions { display: flex; gap: calc(var(--s) * 10px); margin-top: calc(var(--s) * 10px); }
  #settings .actions .primary { background: #f2c14e; color: #1a1408; border-color: #f2c14e; }
  #settings .note { font-size: calc(var(--s) * 12px); color: rgba(255,255,255,0.55); margin-top: calc(var(--s) * 8px); line-height: 1.35; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #fff;
    background: radial-gradient(ellipse at center, rgba(8, 10, 14, 0.35), rgba(8, 10, 14, 0.78));
    pointer-events: none;
  }
  #overlay.hidden { display: none; }
  #overlay .kicker { font-size: calc(var(--s) * 13px); letter-spacing: calc(var(--s) * 6px); font-weight: 600; color: #f2c14e; }
  #overlay h1 {
    font-size: calc(var(--s) * 74px); line-height: 0.95; font-weight: 900; font-style: italic; letter-spacing: -1px;
    background: linear-gradient(180deg, #ffffff 0%, #e9e4da 55%, #b9b2a5 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 calc(var(--s) * 6px) calc(var(--s) * 10px) rgba(0,0,0,0.55));
    margin-top: calc(var(--s) * 8px);
  }
  #overlay h2 { font-size: calc(var(--s) * 24px); letter-spacing: calc(var(--s) * 12px); font-weight: 700; color: #f2c14e; margin-top: calc(var(--s) * 4px); padding-left: calc(var(--s) * 12px); }
  #overlay p { margin-top: calc(var(--s) * 18px); font-size: calc(var(--s) * 16px); max-width: 70%; color: rgba(255,255,255,0.85); line-height: 1.4; }
  #overlay .big {
    font-size: calc(var(--s) * 17px); font-weight: 700; letter-spacing: calc(var(--s) * 3px); margin-top: calc(var(--s) * 28px);
    padding: calc(var(--s) * 11px) calc(var(--s) * 26px); border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.08);
    animation: pulse 1.4s ease-in-out infinite;
  }
  #overlay .small { font-size: calc(var(--s) * 13px); color: rgba(255,255,255,0.6); margin-top: calc(var(--s) * 10px); }
  #overlay .score { font-size: calc(var(--s) * 56px); font-weight: 800; font-variant-numeric: tabular-nums; margin-top: calc(var(--s) * 6px); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="panel left"><div class="lbl">SCORE</div><div class="val" id="score">0</div><div id="combo"></div></div>
    <div id="center"><div id="lives"></div><div id="level"></div></div>
    <div class="panel right"><div class="lbl">HIGH SCORE</div><div class="val" id="high">0</div></div>
    <div id="hint"></div>
  </div>
  <div id="overlay"></div>
  <a id="home" class="ui" href="index.html" target="_self">&larr; Arcade</a>
  <button id="gear" class="ui" aria-label="Settings">&#9881;</button>
  <div id="settings" class="ui hidden">
    <div class="card">
      <div class="col">
      <h3>SPEED</h3>
      <div class="row"><div class="top"><span>Starting truck speed</span><span id="v-startMph"></span></div><input type="range" id="s-startMph" min="15" max="90" step="1"></div>
      <div class="row"><div class="top"><span>Speed-up per house</span><span id="v-rampMph"></span></div><input type="range" id="s-rampMph" min="0" max="8" step="0.5"></div>
      <div class="row"><div class="top"><span>Top speed</span><span id="v-maxMph"></span></div><input type="range" id="s-maxMph" min="30" max="150" step="5"></div>
      <div class="row"><div class="top"><span>Aim guide</span><span></span></div>
        <div class="seg" id="s-guide"><button data-v="first">First 3</button><button data-v="always">Always</button><button data-v="off">Off</button></div></div>
      <div class="note">Dotted line = launch arc preview. Changes apply instantly and are saved.</div>
      </div>
      <div class="col">
      <h3>TRAJECTORY</h3>
      <div class="row"><div class="top"><span>Launch power</span><span id="v-power"></span></div><input type="range" id="s-power" min="60" max="140" step="1"></div>
      <div class="row"><div class="top"><span>Launch angle</span><span id="v-angle"></span></div><input type="range" id="s-angle" min="40" max="85" step="1"></div>
      <div class="row"><div class="top"><span>Gravity</span><span id="v-gravity"></span></div><input type="range" id="s-gravity" min="50" max="150" step="1"></div>
      <div class="row"><div class="top"><span>Hold-to-float strength</span><span id="v-float"></span></div><input type="range" id="s-float" min="0" max="75" step="1"></div>
      <div class="actions"><button id="s-reset">Reset</button><button id="s-done" class="primary">Done</button></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ================= Setup & responsive scaling (desktop + iPad) =================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const H = 540;            // fixed logical height; width adapts to screen aspect
  let W = 960, scale = 1, dpr = 1, RS = 1, RSB = 1;   // RS = pixels per logical unit

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    W = Math.round(Math.max(700, Math.min(1300, H * (vw / vh))));
    scale = Math.min(vw / W, vh / H);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    wrap.style.width = cssW + 'px';
    wrap.style.height = cssH + 'px';
    wrap.style.setProperty('--s', Math.max(0.55, scale).toFixed(3));
    const newRS = Math.round(scale * dpr * 100) / 100;
    if (newRS !== RS) { RS = newRS; RSB = Math.min(RS, 1.5); buildStatic(); }
  }

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  // ================= Constants =================
  const GROUND = 452;               // lawn line where houses stand
  const TRUCK_BASE = GROUND + 54;   // truck tyres sit on the road in front
  const TRUCK_SX = 110;             // truck's screen x
  const SUN_OX = 96;                // sunroof offset inside truck
  const DRIVER_Y = TRUCK_BASE - 124;
  const PK_OX = 12, PK_OY = -44, PR = 11;   // package offset from driver & radius
  // ---- Adjustable speed & trajectory (Settings panel, saved per device) ----
  const MPH = 6;                    // logical px/s per displayed MPH
  const DEFAULTS = { startMph: 38, rampMph: 3, maxMph: 105, power: 100, angle: 70, gravity: 100, float: 45, guide: 'first' };
  const cfg = { ...DEFAULTS };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('slamDunkDeliverySettings') || '{}')); } catch (e) {}
  const BASE_POWER = 977, BASE_GRAVITY = 1900;
  const gravity = () => BASE_GRAVITY * cfg.gravity / 100;
  const floatGravity = () => gravity() * (1 - cfg.float / 100);   // while holding: longer/higher arc
  const launchVX = () => BASE_POWER * cfg.power / 100 * Math.cos(cfg.angle * Math.PI / 180);
  const launchVY = () => -BASE_POWER * cfg.power / 100 * Math.sin(cfg.angle * Math.PI / 180);
  const speedFor = lvl => Math.min(Math.max(cfg.maxMph, cfg.startMph) * MPH, (cfg.startMph + lvl * cfg.rampMph) * MPH);
  const WALL = 10;

  // ================= Helpers =================
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rng(seed) {
    let s = (seed >>> 0) || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function mk(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
    return c;
  }
  function hexRgb(hx) { const n = parseInt(hx.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function shade(hx, f) {  // f in [-1, 1]: negative darkens, positive lightens
    const [r, g, b] = hexRgb(hx), t = f < 0 ? 0 : 255, p = Math.abs(f);
    return `rgb(${Math.round(r + (t - r) * p)},${Math.round(g + (t - g) * p)},${Math.round(b + (t - b) * p)})`;
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
  }
  function speckle(g, r, x, y, w, h, n, a) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = r() < 0.5 ? `rgba(0,0,0,${a * r()})` : `rgba(255,255,255,${a * r()})`;
      g.fillRect(x + r() * w, y + r() * h, 1 + r() * 1.2, 1 + r() * 1.2);
    }
  }
  function vgrad(g, y0, y1, stops) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    stops.forEach(([o, c]) => gr.addColorStop(o, c));
    return gr;
  }
  function hgrad(g, x0, x1, stops) {
    const gr = g.createLinearGradient(x0, 0, x1, 0);
    stops.forEach(([o, c]) => gr.addColorStop(o, c));
    return gr;
  }

  // ================= Pre-rendered static art =================
  let cloudSprites = [], treeSprites = [], ridgeLayers = [], groundTile = null, truckSprite = null;
  let puffSprite = null, dustSprite = null, glowSprite = null;
  const GROUND_TILE = 512, RIDGE_P = 1800;

  function softSprite(rgb) {
    const s = 64, c = mk(s, s), g = c.getContext('2d');
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, `rgba(${rgb},0.9)`); gr.addColorStop(0.45, `rgba(${rgb},0.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    return c;
  }

  function makeCloud(seed) {
    const r = rng(seed), w = 320, h = 130;
    const c = mk(w * RSB, h * RSB), g = c.getContext('2d');
    g.scale(RSB, RSB);
    const blobs = [];
    for (let i = 0; i < 34; i++) {
      const t = r();
      const x = 40 + t * (w - 80);
      const bulge = Math.sin(t * Math.PI);
      blobs.push({ x, y: h - 34 - r() * 46 * bulge, rad: 16 + r() * 26 * (0.5 + bulge) });
    }
    for (const b of blobs) {
      const gr = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.rad);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, b.rad, 0, Math.PI * 2); g.fill();
    }
    // shaded underside, warm sunlit top
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = vgrad(g, 0, h, [[0, 'rgba(255,244,225,0.35)'], [0.55, 'rgba(255,255,255,0)'], [1, 'rgba(120,135,165,0.55)']]);
    g.fillRect(0, 0, w, h);
    return { c, w, h };
  }

  function makeTree(seed) {
    const r = rng(seed), w = 160, h = 210;
    const c = mk(w * RS, h * RS), g = c.getContext('2d');
    g.scale(RS, RS);
    const cx = w / 2, base = h;
    // trunk
    g.fillStyle = hgrad(g, cx - 8, cx + 8, [[0, '#2e2117'], [0.55, '#5e4633'], [1, '#2a1e15']]);
    g.beginPath(); g.moveTo(cx - 8, base); g.quadraticCurveTo(cx - 4, base - 50, cx - 4, base - 110);
    g.lineTo(cx + 4, base - 110); g.quadraticCurveTo(cx + 4, base - 50, cx + 9, base); g.closePath(); g.fill();
    g.strokeStyle = '#3d2c1f'; g.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const y0 = base - 70 - i * 12, dir = i % 2 ? 1 : -1;
      g.lineWidth = 3.2 - i * 0.4;
      g.beginPath(); g.moveTo(cx, y0); g.quadraticCurveTo(cx + dir * 14, y0 - 10, cx + dir * (26 + r() * 14), y0 - 26 - r() * 10); g.stroke();
    }
    // canopy: hundreds of leaf clusters lit from the upper right
    const ccx = cx, ccy = base - 128, R = 58 + r() * 8;
    const leaves = [];
    for (let i = 0; i < 260; i++) {
      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * R;
      const x = ccx + Math.cos(a) * d * 1.1, y = ccy + Math.sin(a) * d * 0.85;
      const light = clamp(0.5 + ((x - ccx) * 0.6 - (y - ccy)) / (R * 2.2) + (r() - 0.5) * 0.35, 0, 1);
      leaves.push({ x, y, s: 5 + r() * 9, light });
    }
    leaves.sort((a, b) => a.light - b.light);
    const dark = hexRgb('#1f3a1c'), lite = hexRgb('#9bb664');
    for (const l of leaves) {
      const k = l.light;
      g.fillStyle = `rgb(${dark.map((d, i) => Math.round(d + (lite[i] - d) * k)).join(',')})`;
      g.beginPath(); g.ellipse(l.x, l.y, l.s, l.s * 0.8, r() * 3, 0, Math.PI * 2); g.fill();
    }
    return { c, w, h };
  }

  function makeRidge(seed, hgt, top, bottom, amps, base, treeline) {
    const r = rng(seed), P = RIDGE_P;
    const c = mk(P * RSB, hgt * RSB), g = c.getContext('2d');
    g.scale(RSB, RSB);
    const ph = amps.map(() => r() * Math.PI * 2);
    const yAt = x => base - amps.reduce((s, [k, a], i) => s + a * Math.sin(Math.PI * 2 * k * x / P + ph[i]), 0);
    g.fillStyle = vgrad(g, 0, hgt, [[0, top], [1, bottom]]);
    g.beginPath(); g.moveTo(0, hgt);
    for (let x = 0; x <= P; x += 4) g.lineTo(x, yAt(x));

  }

  // ================= State =================

  // ================= Audio (synthesized, no files) =================
  let actx = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, dur, type = 'square', vol = 0.12, slide = 0, delay = 0) {
    if (!actx) return;
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.25, freq = 900) {
    if (!actx) return;
    const len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq;
    src.buffer = buf; g.gain.value = vol;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  }
  const sfx = {

  // ================= Houses =================
  const SIDING = ['#c9c2b0', '#8a9ba8', '#a3ae96', '#e4e0d6', '#6f7f86', '#b9a184', '#9d8f7c'];
  const BRICK = ['#8e4a3a', '#9c5b45', '#7a3e33', '#a46a4f'];
  const STUCCO = ['#d8c9ad', '#cdbfa6', '#e2d6c0'];
  const ROOFS = ['#3b3d42', '#4a3f37', '#2e3136', '#3f4a44', '#53463d'];
  const DOORS = ['#5a1e1b', '#1f3247', '#25402e', '#2b2b2b', '#6b4a2b'];
  const SHUTTERS = ['#2b3a2f', '#1f2a36', '#3a2a22', '#222222'];

  function roofYAt(h, x) {
    const top = GROUND - h.wallH, peak = top - h.roofH;
    const L = h.x - 14, R = h.x + h.w + 14, mid = h.x + h.w / 2;
    if (x < L || x > R) return Infinity;
    return x <= mid ? top - (x - L) / (mid - L) * (top - peak)
                    : top - (R - x) / (R - mid) * (top - peak);
  }

  function makeHouse(x, lvl) {
    let types = ['chimney', 'window', 'hoop'];
    if (sameCount >= 1) types = types.filter(t => t !== lastType);
    const type = pick(types);
    sameCount = type === lastType ? sameCount + 1 : 0;
    lastType = type;

    const mat = pick(['siding', 'siding', 'brick', 'stucco']);
    const h = {
      x, type, mat,
      seed: (Math.random() * 1e9) | 0,
      w: rand(180, 240) | 0,
      wallH: rand(135, 180) | 0,
      roofH: rand(65, 95) | 0,
      wall: mat === 'brick' ? pick(BRICK) : mat === 'stucco' ? pick(STUCCO) : pick(SIDING),
      roof: pick(ROOFS), door: pick(DOORS), shutter: pick(SHUTTERS),
      num: 100 + ((Math.random() * 899) | 0),
      open: Math.max(44, 84 - lvl * 3),
      solids: [], netT: 0, sprite: null, smokeT: 0,
    };
    const top = GROUND - h.wallH;

    if (type === 'chimney') {
      h.cw = h.open + WALL * 2;
      h.cx = h.x + h.w * rand(0.55, 0.68);
      if (h.cx + h.cw > h.x + h.w - 8) h.cx = h.x + h.w - 8 - h.cw;
      const baseY = Math.max(roofYAt(h, h.cx), roofYAt(h, h.cx + h.cw));
      const roofTop = Math.min(roofYAt(h, h.cx), roofYAt(h, h.cx + h.cw));
      h.cy = Math.max(GROUND - 300, roofTop - rand(28, 50));
      h.cBase = baseY + 6;
      h.solids.push({ x: h.cx, y: h.cy, w: WALL, h: h.cBase - h.cy });
      h.solids.push({ x: h.cx + h.cw - WALL, y: h.cy, w: WALL, h: h.cBase - h.cy });
      h.solids.push({ x: h.x, y: top, w: h.w, h: h.wallH });
      h.tx = h.cx + h.cw / 2;
    } else if (type === 'window') {
      h.nd = 52;                        // window depth
      h.nh = h.open + 14;               // window opening height
      h.wy = top + rand(18, Math.max(20, h.wallH - h.nh - 34));
      h.solids.push({ x: h.x + h.nd, y: top, w: h.w - h.nd, h: h.wallH });
      h.solids.push({ x: h.x, y: top, w: h.nd, h: h.wy - top });
      h.solids.push({ x: h.x, y: h.wy + h.nh, w: h.nd, h: GROUND - (h.wy + h.nh) });
      h.tx = h.x;
    } else {
      // Driveway hoop on a pole in the front yard
      h.px = h.x - 40;                       // pole x
      h.rimY = GROUND - rand(215, 275);
      h.bbX = h.px - 6;                      // backboard x
      h.rimR = h.bbX - 6;
      h.rimL = h.rimR - (h.open + 14);
      h.solids.push({ x: h.bbX, y: h.rimY - 62, w: 8, h: 80 });        // backboard
      h.solids.push({ x: h.px, y: h.rimY - 40, w: 9, h: GROUND - h.rimY + 40 }); // pole
      h.solids.push({ x: h.rimL - 4, y: h.rimY - 3, w: 7, h: 7 });      // front of rim
      h.solids.push({ x: h.x, y: top, w: h.w, h: h.wallH });
      h.tx = (h.rimL + h.rimR) / 2;
    }
    return h;
  }

  // ---------- House rendering (once per house, cached as a sprite) ----------
  function paintBricks(g, r, x, y, w, h, color, rowH, len) {
    g.fillStyle = '#b4a898'; g.fillRect(x, y, w, h);
    let row = 0;
    for (let yy = y + h; yy > y - rowH; yy -= rowH, row++) {
      const off = (row % 2) * len / 2;
      for (let xx = x - len + off; xx < x + w; xx += len) {
        g.fillStyle = shade(color, (r() - 0.5) * 0.28);
        g.fillRect(xx + 0.6, yy - rowH + 0.6, len - 1.2, rowH - 1.2);
        g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(xx + 0.6, yy - 1.4, len - 1.2, 0.8);
      }
    }
    speckle(g, r, x, y, w, h, w * h / 40, 0.18);
  }

  function paintWall(g, h, r, top) {
    const x = h.x, w = h.w, wh = h.wallH;
    if (h.mat === 'brick') {
      paintBricks(g, r, x, top, w, wh, h.wall, 6, 14);
    } else if (h.mat === 'stucco') {
      g.fillStyle = h.wall; g.fillRect(x, top, w, wh);
      speckle(g, r, x, top, w, wh, w * wh / 6, 0.12);
    } else {
      g.fillStyle = h.wall; g.fillRect(x, top, w, wh);
      for (let y = top; y < GROUND; y += 9) {
        g.fillStyle = vgrad(g, y, y + 9, [[0, 'rgba(255,255,255,0.10)'], [0.75, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.22)']]);
        g.fillRect(x, y, w, 9);
        g.fillStyle = 'rgba(0,0,0,0.28)'; g.fillRect(x, y + 8.2, w, 0.9);
      }
      speckle(g, r, x, top, w, wh, w * wh / 30, 0.08);
      g.fillStyle = '#ece8df'; g.fillRect(x, top, 4, wh); g.fillRect(x + w - 4, top, 4, wh);
    }
    // lighting: sun from the right, shadow under the eaves, ambient occlusion at the base
    g.fillStyle = hgrad(g, x, x + w, [[0, 'rgba(0,0,0,0.16)'], [1, 'rgba(255,236,210,0.07)']]); g.fillRect(x, top, w, wh);
    g.fillStyle = vgrad(g, top, top + 28, [[0, 'rgba(0,0,0,0.5)'], [1, 'rgba(0,0,0,0)']]); g.fillRect(x, top, w, 28);
    // foundation
    g.fillStyle = vgrad(g, GROUND - 10, GROUND, [[0, '#9a958c'], [1, '#77736c']]); g.fillRect(x, GROUND - 10, w, 10);
    speckle(g, r, x, GROUND - 10, w, 10, w / 2, 0.3);
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x, GROUND - 10, w, 1);
  }

  function paintDecorWindow(g, h, x, y, w, hh) {
    // shutters
    for (const sx of [x - 15, x + w + 5]) {
      g.fillStyle = h.shutter; g.fillRect(sx, y - 2, 10, hh + 4);
      g.fillStyle = 'rgba(255,255,255,0.08)';

      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(sx + 10, y - 2, 1.5, hh + 4);
    }
    g.fillStyle = '#ebe7de'; g.fillRect(x - 4, y - 4, w + 8, hh + 8);
    g.fillStyle = '#f4f1ea'; g.fillRect(x - 7, y - 10, w + 14, 6);
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x - 7, y - 4, w + 14, 1.5);
    g.fillStyle = vgrad(g, y, y + hh, [[0, '#b4c7d4'], [0.45, '#73899a'], [1, '#26323b']]);
    g.fillRect(x, y, w, hh);
    g.fillStyle = 'rgba(245,235,215,0.28)'; g.fillRect(x + 1, y + 1, 7, hh - 2); g.fillRect(x + w - 8, y + 1, 7, hh - 2);
    g.save(); g.beginPath(); g.rect(x, y, w, hh); g.clip();
    g.fillStyle = 'rgba(255,255,255,0.2)';
    g.beginPath(); g.moveTo(x + w * 0.35, y); g.lineTo(x + w * 0.62, y); g.lineTo(x + w * 0.2, y + hh); g.lineTo(x - w * 0.07, y + hh); g.fill();
    g.restore();
    g.fillStyle = '#ebe7de'; g.fillRect(x + w / 2 - 1.5, y, 3, hh); g.fillRect(x, y + hh / 2 - 1.5, w, 3);
    g.fillStyle = '#f4f1ea'; g.fillRect(x - 8, y + hh + 3, w + 16, 4);
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x - 6, y + hh + 7, w + 12, 3);
  }

  function paintDoor(g, h, dx) {
    const dw = 34, dh = 66, dy = GROUND - 10 - dh;
    g.fillStyle = '#efebe2'; g.fillRect(dx - 5, dy - 6, dw + 10, dh + 6);
    g.fillStyle = vgrad(g, dy, dy + dh, [[0, shade(h.door, 0.12)], [1, shade(h.door, -0.25)]]); g.fillRect(dx, dy, dw, dh);
    for (const [px, py, pw, ph] of [[4, 5, 11, 22], [19, 5, 11, 22], [4, 33, 11, 28], [19, 33, 11, 28]]) {
      g.fillStyle = 'rgba(0,0,0,0.28)'; g.fillRect(dx + px, dy + py, pw, ph);
      g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(dx + px + 1, dy + py + 1, pw - 1, ph - 1);
      g.fillStyle = shade(h.door, -0.05); g.fillRect(dx + px + 1.5, dy + py + 1.5, pw - 3, ph - 3);
    }
    const kg = g.createRadialGradient(dx + 28, dy + 36, 0, dx + 28, dy + 36, 3);
    kg.addColorStop(0, '#fff3b0'); kg.addColorStop(1, '#a07a20');
    g.fillStyle = kg; g.beginPath(); g.arc(dx + 28, dy + 36, 2.6, 0, Math.PI * 2); g.fill();
    // porch light
    const lx = dx - 12, ly = dy + 14;
    const lg = g.createRadialGradient(lx, ly, 0, lx, ly, 26);
    lg.addColorStop(0, 'rgba(255,210,140,0.45)'); lg.addColorStop(1, 'rgba(255,210,140,0)');
    g.fillStyle = lg; g.fillRect(lx - 26, ly - 26, 52, 52);
    g.fillStyle = '#1a1a1a'; g.fillRect(lx - 3, ly - 7, 6, 3); g.fillRect(lx - 1, ly + 6, 2, 3);
    g.fillStyle = '#ffe2a8'; g.fillRect(lx - 2.5, ly - 4, 5, 10);
    // step
    g.fillStyle = vgrad(g, GROUND - 10, GROUND, [[0, '#c8c3b9'], [1, '#8d8980']]); g.fillRect(dx - 8, GROUND - 10, dw + 16, 10);
    // house number plaque
    g.fillStyle = '#1d1d1d'; g.fillRect(dx + dw + 8, dy + 8, 22, 11);
    g.fillStyle = '#e8dcb8'; g.font = '700 8px Helvetica, Arial, sans-serif'; g.textAlign = 'center';
    g.fillText(h.num, dx + dw + 19, dy + 16.5);
  }

  function paintOpenWindow(g, h, r) {
    const x = h.x, y = h.wy, w = h.nd, hh = h.nh, top = GROUND - h.wallH;
    // interior of the room
    g.fillStyle = vgrad(g, y, y + hh, [[0, '#14171b'], [0.7, '#22211f'], [1, '#2e2924']]); g.fillRect(x, y, w, hh);
    const lg = g.createRadialGradient(x + w - 12, y + hh * 0.45, 0, x + w - 12, y + hh * 0.45, w * 0.8);
    lg.addColorStop(0, 'rgba(255,196,120,0.35)'); lg.addColorStop(1, 'rgba(255,196,120,0)');
    g.fillStyle = lg; g.fillRect(x, y, w, hh);
    // table lamp silhouette in the room
    g.fillStyle = '#e8c890'; g.beginPath(); g.moveTo(x + 20, y + hh - 26); g.lineTo(x + 30, y + hh - 26); g.lineTo(x + 33, y + hh - 16); g.lineTo(x + 17, y + hh - 16); g.fill();
    g.fillStyle = '#1a1714'; g.fillRect(x + 24, y + hh - 16, 2, 10); g.fillRect(x + 8, y + hh - 6, 40, 6);
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x, y, 6, hh); g.fillRect(x, y, w, 4);
    // sheer curtain gathered at the side
    for (let i = 0; i < 6; i++) {
      g.fillStyle = i % 2 ? 'rgba(236,226,206,0.75)' : 'rgba(205,192,168,0.75)';
      g.beginPath(); g.moveTo(x + w - 14 + i * 2.3, y); g.lineTo(x + w - 11.7 + i * 2.3, y);
      g.lineTo(x + w - 8 + i * 1.5, y + hh); g.lineTo(x + w - 10.3 + i * 1.5, y + hh); g.fill();
    }
    // raised sash glass above the opening
    const sh = Math.min(30, y - top - 8);
    if (sh > 8) {
      g.fillStyle = '#ebe7de'; g.fillRect(x, y - sh - 3, w, sh + 3);
      g.fillStyle = vgrad(g, y - sh, y, [[0, '#b4c7d4'], [1, '#4a5d6b']]); g.fillRect(x + 4, y - sh, w - 8, sh - 3);
      g.fillStyle = 'rgba(255,255,255,0.22)';
      g.beginPath(); g.moveTo(x + 14, y - sh); g.lineTo(x + 24, y - sh); g.lineTo(x + 14, y - 3); g.lineTo(x + 4, y - 3); g.fill();
    }
    // trim, sill and flower box
    g.fillStyle = '#ebe7de'; g.fillRect(x + w - 3, y - 2, 4, hh + 2);
    g.fillStyle = '#f4f1ea'; g.fillRect(x - 6, y + hh, w + 8, 5);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x - 6, y + hh + 5, w + 8, 2);
    g.fillStyle = vgrad(g, y + hh + 7, y + hh + 19, [[0, '#6e4c2c'], [1, '#3e2a17']]); g.fillRect(x - 4, y + hh + 7, w + 2, 12);
    for (let i = 0; i < 30; i++) {
      g.fillStyle = r() < 0.55 ? shade('#3f6b2a', (r() - 0.5) * 0.5) : pick(['#c8384a', '#e9b23c', '#e8e2f0', '#b04aa0']);
      g.beginPath(); g.arc(x - 2 + r() * (w - 2), y + hh + 6 - r() * 6, 1.5 + r() * 2.2, 0, Math.PI * 2); g.fill();
    }
  }

  function paintChimney(g, h, r) {
    const { cx, cy, cw, cBase } = h;
    paintBricks(g, r, cx, cy, cw, cBase - cy, '#8c3f31', 5, 11);
    g.fillStyle = hgrad(g, cx, cx + cw, [[0, 'rgba(0,0,0,0.3)'], [0.6, 'rgba(0,0,0,0)'], [1, 'rgba(255,230,200,0.08)']]);
    g.fillRect(cx, cy, cw, cBase - cy);
    g.fillStyle = vgrad(g, cy, cy + 14, [[0, 'rgba(20,14,10,0.55)'], [1, 'rgba(20,14,10,0)']]); g.fillRect(cx, cy, cw, 14);
    // flue opening and concrete crown
    g.fillStyle = vgrad(g, cy - 5, cy + 12, [[0, '#050403'], [1, '#2a1f18']]); g.fillRect(cx + WALL, cy - 5, cw - 2 * WALL, 17);
    for (const [px, pw] of [[cx - 4, WALL + 5], [cx + cw - WALL - 1, WALL + 5]]) {
      g.fillStyle = vgrad(g, cy - 6, cy, [[0, '#b9b4ab'], [1, '#77736b']]); g.fillRect(px, cy - 6, pw, 6);
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(px, cy, pw, 1.5);
    }
  }

  function paintRoof(g, h, r) {
    const top = GROUND - h.wallH, peak = top - h.roofH;
    const L = h.x - 14, R = h.x + h.w + 14, M = h.x + h.w / 2;
    g.save();
    g.beginPath(); g.moveTo(L, top); g.lineTo(M, peak); g.lineTo(R, top); g.closePath(); g.clip();
    g.fillStyle = h.roof; g.fillRect(L, peak, R - L, top - peak);
    let row = 0;
    for (let y = top; y > peak; y -= 6.5, row++) {
      const off = (row % 2) * 7;
      for (let x = L - 14 + off; x < R; x += 14) {
        g.fillStyle = shade(h.roof, (r() - 0.45) * 0.22);
        g.fillRect(x + 0.5, y - 6.5, 13, 6.5);
        g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x + 13.5, y - 6.5, 0.8, 6.5);
      }
      g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(L, y - 1.2, R - L, 1.2);
    }
    speckle(g, r, L, peak, R - L, top - peak, (R - L) * (top - peak) / 12, 0.2);
    g.fillStyle = hgrad(g, L, R, [[0, 'rgba(0,0,0,0.28)'], [0.5, 'rgba(0,0,0,0.05)'], [1, 'rgba(255,240,220,0.1)']]);
    g.fillRect(L, peak, R - L, top - peak);
    g.restore();
    // rake trim
    g.strokeStyle = '#e9e5dc'; g.lineWidth = 3.5; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(L, top); g.lineTo(M, peak); g.lineTo(R, top); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(L + 2, top + 2); g.lineTo(M, peak + 3); g.lineTo(R - 2, top + 2); g.stroke();
    // fascia + gutter + downspout
    g.fillStyle = vgrad(g, top - 1, top + 6, [[0, '#f4f1ea'], [0.6, '#cfcabf'], [1, '#8f8b84']]); rr(g, L - 1, top - 1, R - L + 2, 7, 2.5); g.fill();
    g.fillStyle = hgrad(g, R - 12, R - 7, [[0, '#9a968e'], [0.5, '#ece8e0'], [1, '#8a867f']]); g.fillRect(R - 12, top + 6, 5, GROUND - top - 12);
    g.fillRect(R - 15, GROUND - 9, 10, 3);
  }

  function paintBushes(g, r, x0, x1) {
    for (let bx = x0 + 10; bx < x1 - 6; bx += 18 + r() * 8) {
      const rad = 10 + r() * 6;
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(bx, GROUND - 1, rad * 1.2, 3, 0, 0, Math.PI * 2); g.fill();
      const leaves = [];
      for (let i = 0; i < 60; i++) {
        const a = r() * Math.PI, d = Math.sqrt(r()) * rad;
        const lx = bx + Math.cos(a) * d * 1.2, ly = GROUND - 2 - Math.sin(a) * d * 1.3;
        leaves.push({ lx, ly, s: 2 + r() * 3.2, k: clamp(0.35 + (lx - bx) / (rad * 3) + (GROUND - ly) / (rad * 3) + (r() - 0.5) * 0.3, 0, 1) });
      }
      leaves.sort((a, b) => a.k - b.k);
      for (const l of leaves) {
        g.fillStyle = `rgb(${30 + l.k * 90 | 0},${55 + l.k * 105 | 0},${25 + l.k * 45 | 0})`;
        g.beginPath(); g.arc(l.lx, l.ly, l.s, 0, Math.PI * 2); g.fill();
      }
    }
  }

  function renderHouse(h) {
    const top = GROUND - h.wallH, peak = top - h.roofH;
    let minY = peak - 8; if (h.type === 'chimney') minY = Math.min(minY, h.cy - 14);
    const ox = h.x - 40, ow = h.w + 150, oy = Math.floor(minY), oh = GROUND + 12 - oy;
    const c = mk(ow * RS, oh * RS), g = c.getContext('2d');
    g.setTransform(RS, 0, 0, RS, -ox * RS, -oy * RS);
    const r = rng(h.seed);
    g.fillStyle = vgrad(g, GROUND, GROUND + 10, [[0, 'rgba(0,0,0,0.38)'], [1, 'rgba(0,0,0,0)']]);
    g.fillRect(h.x - 16, GROUND, h.w + 32, 10);
    if (h.type === 'chimney') paintChimney(g, h, r);
    g.save(); g.beginPath();
    if (h.type === 'window') {
      g.rect(h.x + h.nd, top, h.w - h.nd, h.wallH);
      g.rect(h.x, top, h.nd, h.wy - top);
      g.rect(h.x, h.wy + h.nh, h.nd, GROUND - h.wy - h.nh);
    } else g.rect(h.x, top, h.w, h.wallH);
    g.clip();
    paintWall(g, h, r, top);
    g.restore();
    if (h.type === 'window') paintOpenWindow(g, h, r);
    const doorX = h.x + h.w - 60;
    const left = h.x + (h.type === 'window' ? h.nd + 30 : 30);
    const ww = 38, wh = Math.min(56, h.wallH - 80);
    const slots = Math.max(0, Math.floor((doorX - 22 - left + 30) / (ww + 30)));
    for (let i = 0; i < Math.min(2, slots); i++) paintDecorWindow(g, h, left + i * (ww + 30), top + 34, ww, wh);
    paintDoor(g, h, doorX);
    paintRoof(g, h, r);
    paintBushes(g, r, h.x + (h.type === 'window' ? h.nd + 4 : 2), doorX - 14);
    paintBushes(g, r, doorX + 70, h.x + h.w + 6);
    // mailbox
    const mx = h.x + h.w + 40;
    g.fillStyle = hgrad(g, mx, mx + 5, [[0, '#5a412c'], [1, '#2f2217']]); g.fillRect(mx, GROUND - 36, 5, 36);
    g.fillStyle = vgrad(g, GROUND - 52, GROUND - 36, [[0, '#585d63'], [0.4, '#2c3035'], [1, '#141619']]);
    g.beginPath(); g.moveTo(mx - 10, GROUND - 36); g.lineTo(mx - 10, GROUND - 46); g.quadraticCurveTo(mx + 3, GROUND - 56, mx + 16, GROUND - 46);
    g.lineTo(mx + 16, GROUND - 36); g.closePath(); g.fill();
    g.fillStyle = '#b8261d'; g.fillRect(mx + 13, GROUND - 58, 2.5, 13); g.fillRect(mx + 13, GROUND - 58, 6, 4);
    h.sprite = { c, ox, oy, ow, oh };
  }

  function drawHoop(h) {
    // steel pole
    ctx.fillStyle = hgrad(ctx, h.px, h.px + 9, [[0, '#3a3d42'], [0.4, '#c9ccd1'], [1, '#2a2c30']]);
    ctx.fillRect(h.px, h.rimY - 40, 9, GROUND - h.rimY + 40);
    ctx.fillStyle = '#222'; ctx.fillRect(h.px - 4, GROUND - 3, 17, 3);
    // arm to the backboard
    ctx.fillStyle = '#2e3135'; ctx.fillRect(h.bbX + 6, h.rimY - 34, h.px - h.bbX - 5, 4); ctx.fillRect(h.bbX + 6, h.rimY - 8, h.px - h.bbX - 5, 3);
    // tempered-glass backboard seen edge-on
    ctx.fillStyle = 'rgba(200,225,240,0.55)'; ctx.fillRect(h.bbX, h.rimY - 62, 8, 80);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(h.bbX, h.rimY - 62, 8, 2.5); ctx.fillRect(h.bbX, h.rimY + 15.5, 8, 2.5);
    ctx.fillStyle = '#1e2a3a'; ctx.fillRect(h.bbX - 1, h.rimY + 12, 10, 6);
    // net
    const sw = Math.sin(h.netT * 22) * h.netT * 7;
    const nb = h.rimY + 30 + h.netT * 12;
    ctx.strokeStyle = 'rgba(245,245,245,0.85)'; ctx.lineWidth = 1;
    const n = 6;
    for (let i = 0; i <= n; i++) {
      const x0 = h.rimL + (h.rimR - h.rimL) * i / n;
      const x1 = h.rimL + 9 + (h.rimR - h.rimL - 18) * (n - i) / n + sw;
      ctx.beginPath(); ctx.moveTo(x0, h.rimY + 1); ctx.lineTo(x1, nb); ctx.stroke();
      const x2 = h.rimL + 9 + (h.rimR - h.rimL - 18) * i / n + sw;
      ctx.beginPath(); ctx.moveTo(x0, h.rimY + 1); ctx.lineTo(x2, nb); ctx.stroke();
    }
    // orange steel rim with tube shading
    ctx.fillStyle = vgrad(ctx, h.rimY - 2.5, h.rimY + 2.5, [[0, '#ff8a4a'], [0.5, '#d4461a'], [1, '#7d250b']]);
    ctx.fillRect(h.rimL - 2, h.rimY - 2.5, h.bbX - h.rimL + 2, 5);
    ctx.fillStyle = '#5a1d0a'; ctx.fillRect(h.rimR, h.rimY - 1, 6, 6);
  }

  // ================= Game flow =================
  function resetWorld() {
    houses = []; particles = []; texts = [];
    lastType = ''; sameCount = 0;
    camX = tx - TRUCK_SX;
    active = makeHouse(camX + W * 0.85, 0);
    houses.push(active);
    driver.mode = 'truck'; driver.pop = 1;
  }

  function start() {
    score = 0; lives = 3; streak = 0; level = 0; speed = speedFor(0);
    resetWorld();
    state = 'drive';
    holding = false;
    showOverlay(null);
    updateHud();
  }

  function addPuff(x, y, vx, vy, size, life, sprite, alpha, grow = 1.5, g = 0) {
    particles.push({ x, y, vx, vy, life, max: life, size, type: 'puff', sprite, alpha, grow, g });
  }

  function launch() {
    state = 'air';
    driver.mode = 'air';
    driver.x = tx + SUN_OX;
    driver.y = DRIVER_Y;
    driver.vx = speed + launchVX();
    driver.vy = launchVY();
    driver.rot = 0;
    sfx.launch();
    for (let i = 0; i < 12; i++) addPuff(driver.x + rand(-14, 14), TRUCK_BASE - 112, rand(-140, 40), rand(-50, 20), rand(10, 18), 0.6, puffSprite, 0.5, 2.2);
  }

  function endRound(t) { state = 'result'; resultT = t; }

  function nextRound() {
    if (lives <= 0) { gameOver(); return; }
    level++;
    speed = speedFor(level);
    const last = houses[houses.length - 1];
    const nx = Math.max(camX + W + 90, last.x + last.w + 230);
    active = makeHouse(nx, level);
    houses.push(active);
    houses = houses.filter(h => h.x + h.w + 120 > camX - 200);
    driver.mode = 'truck'; driver.pop = 0;
    state = 'drive';
    updateHud();
  }

  function gameOver() {
    state = 'over'; overT = 0;
    sfx.over();
    const isNew = score > 0 && score >= high;
    showOverlay(`
      <div class="kicker">ROUTE COMPLETE</div>
      <div class="score">${score}</div>
      <p>${isNew ? '<b style="color:#f2c14e">New high score!</b>' : 'High score: ' + high}</p>
      <div class="big">${isTouch ? 'TAP' : 'PRESS SPACE'} TO PLAY AGAIN</div>`);
  }

  function addText(text, wx, wy, color, size, life = 1.3) {
    texts.push({ text, x: wx - camX, y: wy, color, size, t: 0, max: life, rot: rand(-0.06, 0.06) });
  }

  function dunk(offset, half, x, y) {
    const h = active;
    h.netT = 1;
    const perfect = Math.abs(offset) < half * 0.35;
    streak++;
    const mult = Math.min(5, streak);
    const pts = (100 + (perfect ? 50 : 0)) * mult;
    score += pts;
    if (score > high) { high = score; try { localStorage.setItem('slamDunkDeliveryHigh', String(high)); } catch (e) {} }
    driver.mode = 'gone';
    addText('SLAM DUNK!', camX + W / 2, 190, '#f2c14e', 78, 1.5);
    if (perfect) addText('SWISH', x, y - 72, '#ffffff', 32, 1.2);
    addText('+' + pts + (mult > 1 ? `  ×${mult}` : ''), x, y - 34, '#ffffff', 26, 1.2);
    const cols = ['#e63946', '#f2c14e', '#3a86ff', '#2ec4b6', '#ffffff', '#c0c0c0', '#ff7f11'];
    for (let i = 0; i < 170; i++) {
      const a = rand(-Math.PI, 0), s = rand(150, 720);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: rand(1.6, 2.8), max: 2.8,
        size: rand(4, 8), color: pick(cols), type: 'confetti', rot: rand(0, 6), vr: rand(-14, 14), g: 650, drag: 0.985 });
    }
    for (let i = 0; i < 22; i++) {
      const a = rand(0, Math.PI * 2), s = rand(60, 260);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, size: rand(6, 14), type: 'glow', drag: 0.92 });
    }
    for (let i = 0; i < 10; i++) addPuff(x, y, rand(-80, 80), rand(-60, 20), rand(12, 20), 0.7, h.type === 'chimney' ? dustSprite : puffSprite, 0.5, 2);
    particles.push({ x, y, life: 0.45, max: 0.45, type: 'ring', size: 10, color: 'rgba(255,255,255,0.9)' });
    shake = 12;
    sfx.dunk(); if (perfect) sfx.swish();
    endRound(1.5);
    updateHud();
  }

  function crash(px, py, label) {
    streak = 0; lives--;
    const cols = ['#c99a62', '#b8864f', '#a87843', '#d9b07a', '#8a5f33'];
    for (let i = 0; i < 40; i++) {
      const a = rand(0, Math.PI * 2), s = rand(80, 520);
      particles.push({ x: px, y: py, vx: Math.cos(a) * s - 80, vy: Math.sin(a) * s - 200, life: rand(1.4, 2.4), max: 2.4,
        size: rand(4, 11), color: pick(cols), type: 'debris', rot: rand(0, 6), vr: rand(-12, 12), g: 1500, drag: 0.995, bounce: true });
    }
    for (let i = 0; i < 26; i++) {
      const a = rand(0, Math.PI * 2), s = rand(60, 360);
      particles.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 150, life: rand(1.2, 2), max: 2,
        size: rand(2, 3.5), color: '#f1ede4', type: 'peanut', rot: rand(0, 6), vr: rand(-8, 8), g: 1100, drag: 0.98, bounce: true });
    }
    for (let i = 0; i < 14; i++) addPuff(px, py, rand(-90, 90), rand(-90, 30), rand(14, 26), rand(0.7, 1.1), dustSprite, 0.6, 2.2, -30);
    addText(label, px, py - 44, '#ffffff', 40, 1.2);
    driver.mode = 'ragdoll';
    driver.vx = -170; driver.vy = -380; driver.vr = 9;
    shake = 9;
    sfx.crash();
    endRound(1.4);
    updateHud();
  }

  function tooLate() {
    streak = 0; lives--;
    addText('TOO LATE', tx + SUN_OX + 60, DRIVER_Y - 70, '#ffffff', 38, 1.2);
    sfx.late();
    endRound(1.1);
    updateHud();
  }

  // ================= Collision =================
  function circleRect(cx, cy, r, s) {
    const nx = clamp(cx, s.x, s.x + s.w), ny = clamp(cy, s.y, s.y + s.h);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function checkPackage(ppx, ppy, px, py) {
    const h = active;
    // ---- scoring ----
    if (h.type === 'chimney') {
      if (ppy < h.cy && py >= h.cy) {
        const ix = ppx + (px - ppx) * (h.cy - ppy) / (py - ppy);
        if (ix > h.cx + WALL + 2 && ix < h.cx + h.cw - WALL - 2) {
          dunk(ix - (h.cx + h.cw / 2), (h.cw - WALL * 2) / 2, ix, h.cy); return true;
        }
      }
    } else if (h.type === 'window') {
      if (px > h.x + 10 && px < h.x + h.nd && py > h.wy + PR * 0.6 && py < h.wy + h.nh - PR * 0.6) {
        dunk(py - (h.wy + h.nh / 2), h.nh / 2, h.x + 20, h.wy + h.nh / 2); return true;
      }
    } else {
      if (ppy < h.rimY && py >= h.rimY) {
        const ix = ppx + (px - ppx) * (h.rimY - ppy) / (py - ppy);
        if (ix > h.rimL + 2 && ix < h.rimR - 2) {
          dunk(ix - (h.rimL + h.rimR) / 2, (h.rimR - h.rimL) / 2, ix, h.rimY); return true;
        }
      }
    }
    // ---- crashes ----
    for (const hs of houses) {
      for (const s of hs.solids) {
        if (circleRect(px, py, PR, s)) {
          crash(px, py, hs.type === 'hoop' && s.h < 90 && s.w < 10 ? 'BRICK' : 'SPLAT'); return true;
        }
      }
      const ry = roofYAt(hs, px);
      if (ry !== Infinity && py + PR * 0.8 > ry && py < GROUND - hs.wallH + 10) {
        crash(px, py, 'SPLAT'); return true;
      }
    }
    if (py + PR >= GROUND) { crash(px, GROUND - PR, 'MISSED'); return true; }
    return false;
  }

  // ================= Update =================
  function update(dt) {
    time += dt;
    const sp = (state === 'title' || state === 'over') ? 140 : speed;
    tx += sp * dt;
    camX = tx - TRUCK_SX;
    wheelRot += sp * dt / 18;
    if (state === 'over') overT += dt;

    // keep attract-mode scenery flowing
    if (state === 'title' || state === 'over') {
      const last = houses[houses.length - 1];
      if (!last || last.x < camX + W) houses.push(makeHouse((last ? last.x + last.w : camX + W) + rand(260, 420), 0));
      houses = houses.filter(h => h.x + h.w + 120 > camX - 200);
    }

    // exhaust
    if (Math.random() < dt * 14) addPuff(tx - 2, TRUCK_BASE - 22, rand(-80, -40), rand(-30, -10), rand(5, 9), 0.9, puffSprite, 0.3, 2.5, -15);

    // chimney smoke
    for (const h of houses) {
      if (h.type !== 'chimney' || h.x > camX + W + 40 || h.x + h.w < camX - 40) continue;
      h.smokeT -= dt;
      if (h.smokeT <= 0) {
        h.smokeT = 0.18;
        addPuff(h.cx + h.cw / 2 + rand(-5, 5), h.cy - 4, rand(-25, -8), rand(-45, -30), rand(6, 9), 2.4, puffSprite, 0.22, 4, 0);
      }
    }

    // driver
    if (driver.mode === 'truck') {
      driver.pop = Math.min(1, driver.pop + dt * 4);
      driver.x = tx + SUN_OX; driver.y = DRIVER_Y + (1 - driver.pop) * 44;
    } else if (driver.mode === 'air') {
      const steps = 3, h = dt / steps;
      for (let i = 0; i < steps && driver.mode === 'air'; i++) {
        const ppx = driver.x + PK_OX, ppy = driver.y + PK_OY;
        driver.vy += (holding ? floatGravity() : gravity()) * h;
        driver.x += driver.vx * h; driver.y += driver.vy * h;
        driver.rot = clamp(driver.vy / 2200, -0.35, 0.45);
        checkPackage(ppx, ppy, driver.x + PK_OX, driver.y + PK_OY);
      }
      if (driver.mode === 'air' && holding && Math.random() < dt * 30) {
        addPuff(driver.x - 8, driver.y + 20, rand(-80, -40), rand(20, 50), 5, 0.4, puffSprite, 0.35, 2);
      }
    } else if (driver.mode === 'ragdoll') {
      driver.vy += gravity() * dt; driver.x += driver.vx * dt; driver.y += driver.vy * dt; driver.rot += driver.vr * dt;
      if (driver.y > H + 120) driver.mode = 'gone';
    }

    // round logic
    if (state === 'drive' && active && active.tx < tx + SUN_OX + 4) tooLate();
    if (state === 'result') {
      resultT -= dt;
      if (resultT <= 0 && driver.mode !== 'ragdoll') nextRound();
    }

    for (const h of houses) if (h.netT > 0) h.netT = Math.max(0, h.netT - dt * 1.6);

    // particles
    for (const p of particles) {
      p.life -= dt;
      if (p.type === 'ring') { p.size += 520 * dt; continue; }
      p.vy += (p.g || 0) * dt;
      if (p.drag) { const d = Math.pow(p.drag, dt * 60); p.vx *= d; p.vy *= d; }
      if (p.type === 'confetti') p.vx += Math.sin(time * 8 + p.rot) * 40 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vr) p.rot += p.vr * dt;
      if (p.bounce && p.y > GROUND - 2) { p.y = GROUND - 2; p.vy *= -0.3; p.vx *= 0.7; p.vr *= 0.6; }
    }
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 700) particles.splice(0, particles.length - 700);

    for (const t of texts) t.t += dt;
    texts = texts.filter(t => t.t < t.max);

    shake = Math.max(0, shake - dt * 40);
  }

  // ================= Drawing =================
  function drawSky() {
    ctx.fillStyle = vgrad(ctx, 0, GROUND, [[0, '#2f5f9e'], [0.45, '#6e9cc9'], [0.8, '#b9cfdf'], [1, '#e9dfcf']]);
    ctx.fillRect(0, 0, W, GROUND + 4);
    // sun with soft bloom
    const sx = W * 0.8, sy = 92;
    let gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, 260);
    gr.addColorStop(0, 'rgba(255,248,225,0.55)'); gr.addColorStop(0.25, 'rgba(255,236,200,0.22)'); gr.addColorStop(1, 'rgba(255,236,200,0)');
    ctx.fillStyle = gr; ctx.fillRect(sx - 260, sy - 260, 520, 520);
    gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, 26);
    gr.addColorStop(0, '#fffef6'); gr.addColorStop(0.7, '#fff6d8'); gr.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(sx, sy, 26, 0, Math.PI * 2); ctx.fill();

    // clouds (slow parallax + drift)
    const span = W + 400;
    for (let i = 0; i < 6; i++) {
      const cs = cloudSprites[i % cloudSprites.length];
      const sc = 0.55 + ((i * 37) % 10) / 18;
      const x = (((i * 290 - camX * 0.04 - time * 6) % span) + span) % span - 300;
      const y = 30 + ((i * 61) % 150);
      ctx.globalAlpha = 0.9 - (i % 3) * 0.12;
      ctx.drawImage(cs.c, x, y, cs.w * sc, cs.h * sc);
    }
    ctx.globalAlpha = 1;

    // distant ridges, hills and tree line (parallax, atmospheric haze)
    for (const L of ridgeLayers) {
      const off = ((camX * L.f) % RIDGE_P + RIDGE_P) % RIDGE_P;
      for (let x = -off; x < W; x += RIDGE_P) ctx.drawImage(L.c, x, L.y, RIDGE_P, L.hgt);
    }
    ctx.fillStyle = vgrad(ctx, GROUND - 160, GROUND, [[0, 'rgba(233,223,207,0)'], [1, 'rgba(233,223,207,0.35)']]);
    ctx.fillRect(0, GROUND - 160, W, 160);
  }

  function drawTrees() {
    const spacing = 170;
    const startI = Math.floor((camX - 160) / spacing), endI = Math.floor((camX + W + 100) / spacing);
    for (let i = startI; i <= endI; i++) {
      const hsh = Math.abs(Math.sin(i * 127.1) * 43758.5453) % 1;
      if (hsh < 0.42) continue;
      const t = treeSprites[(i & 0x7fffffff) % treeSprites.length];
      const s = 0.75 + hsh * 0.45;
      const x = i * spacing + hsh * 80;
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x, GROUND + 1, 26 * s, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.drawImage(t.c, x - t.w * s / 2, GROUND - t.h * s + 2, t.w * s, t.h * s);
    }
  }

  function drawHouse(h) {
    if (!h.sprite) renderHouse(h);
    const s = h.sprite;
    ctx.drawImage(s.c, s.ox, s.oy, s.ow, s.oh);
    if (h.type === 'hoop') drawHoop(h);

    if (h === active && (state === 'drive' || state === 'air')) {
      // subtle target marker
      const bob = Math.sin(time * 6) * 5, pulse = 0.55 + Math.sin(time * 6) * 0.25;
      let ax, ay, dir;
      if (h.type === 'chimney') { ax = h.cx + h.cw / 2; ay = h.cy - 34 + bob; dir = 0; }
      else if (h.type === 'hoop') { ax = (h.rimL + h.rimR) / 2; ay = h.rimY - 38 + bob; dir = 0; }
      else { ax = h.x - 28 + bob; ay = h.wy + h.nh / 2; dir = -Math.PI / 2; }
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(dir);
      ctx.drawImage(glowSprite, -22, -22, 44, 44);
      ctx.globalAlpha = pulse + 0.3;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-9, -6); ctx.lineTo(0, 3); ctx.lineTo(9, -6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-9, -15); ctx.lineTo(0, -6); ctx.lineTo(9, -15); ctx.stroke();
      ctx.restore();
    }
  }

  function drawPackageLocal(x, y) {
    const s = PR;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#d9b07a';
    ctx.beginPath(); ctx.moveTo(-s, -s + 3); ctx.lineTo(-s + 5, -s - 2); ctx.lineTo(s + 5, -s - 2); ctx.lineTo(s, -s + 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#946a3d';
    ctx.beginPath(); ctx.moveTo(s, -s + 3); ctx.lineTo(s + 5, -s - 2); ctx.lineTo(s + 5, s - 5); ctx.lineTo(s, s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = vgrad(ctx, -s, s, [[0, '#cfa069'], [1, '#ad7e48']]); ctx.fillRect(-s, -s + 3, s * 2, s * 2 - 3);
    ctx.fillStyle = 'rgba(226,212,178,0.9)'; ctx.fillRect(-2.5, -s + 3, 5, s * 2 - 3);
    ctx.beginPath(); ctx.moveTo(-0.5, -s + 3); ctx.lineTo(4.5, -s - 2); ctx.lineTo(9.5, -s - 2); ctx.lineTo(4.5, -s + 3); ctx.fill();
    ctx.fillStyle = '#f4f1ea'; ctx.fillRect(-s + 2, 2, 8, 6.5);
    ctx.fillStyle = '#333';

    ctx.strokeStyle = 'rgba(70,45,20,0.55)'; ctx.lineWidth = 0.8; ctx.strokeRect(-s, -s + 3, s * 2, s * 2 - 3);

  }

  function limb(a, b, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

  function drawDriver(x, y, rot, pose) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const SK = '#d9a77c', SKD = '#b07a52', UNI = '#5b3a1d', UNIL = '#7a5230', UNID = '#3d2611', SOCK = '#e6e0d4', SHOE = '#24180f';
    const k = pose === 'air' ? Math.sin(time * 14) * 4 : 0;
    let legs;
    if (pose === 'truck') legs = [[[-4, 14], [-5, 26], [-5, 38]], [[4, 14], [5, 26], [5, 38]]];
    else if (pose === 'air') legs = [[[-4, 14], [-11 + k * 0.3, 24], [-15, 34 + k * 0.5]], [[4, 14], [10, 22], [16 - k * 0.4, 30]]];
    else legs = [[[-4, 14], [-13, 20], [-8, 32]], [[4, 14], [13, 18], [20, 28]]];
    legs.forEach(([hp, kn, an], i) => {
      const back = i === 0;
      limb(lerp2(kn, an, 0.15), an, 5, back ? SKD : SK);
      limb(lerp2(hp, kn, 0.4), kn, 5.6, back ? SKD : SK);
      limb(hp, lerp2(hp, kn, 0.55), 8, back ? UNID : UNI);
      limb(lerp2(kn, an, 0.72), an, 5.4, SOCK);
      ctx.fillStyle = SHOE; ctx.beginPath(); ctx.ellipse(an[0] + 3.5, an[1] + 2, 6, 3.2, 0, 0, Math.PI * 2); ctx.fill();
    });

    ctx.fillStyle = UNI; rr(ctx, -9, 7, 18, 10, 3); ctx.fill();
    // arms
    let hb, hf, eb, ef;
    if (pose === 'ragdoll') { hb = [-22, -30 + Math.sin(time * 20) * 4]; hf = [22, -34]; eb = [-14, -24]; ef = [16, -26]; }
    else { hb = [PK_OX - 8, PK_OY + 11]; hf = [PK_OX + 7, PK_OY + 11]; eb = [-9, -30]; ef = [15, -29]; }
    const sb = [-6, -15], sf = [7, -15];
    limb(lerp2(sb, eb, 0.4), eb, 4.6, SKD); limb(eb, hb, 4.3, SKD);
    limb(sb, lerp2(sb, eb, 0.5), 7, UNID);
    ctx.fillStyle = SKD; ctx.beginPath(); ctx.arc(hb[0], hb[1], 3, 0, Math.PI * 2); ctx.fill();
    // torso
    ctx.fillStyle = hgrad(ctx, -9, 9, [[0, UNID], [0.6, UNI], [1, UNIL]]);
    rr(ctx, -9, -19, 18, 27, 5); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-1, -14, 1, 18);
    ctx.fillStyle = '#c9a24a'; ctx.fillRect(2.5, -12, 5, 3);
    ctx.fillStyle = '#1c130b'; ctx.fillRect(-9, 4, 18, 3.2);
    ctx.fillStyle = '#b8a070'; ctx.fillRect(-1.5, 4.2, 3.5, 2.8);
    ctx.fillStyle = UNIL; ctx.beginPath(); ctx.moveTo(-4, -19); ctx.lineTo(0, -14); ctx.lineTo(5, -19); ctx.fill();
    // head
    ctx.fillStyle = SKD; ctx.fillRect(-1.5, -23, 5, 5);
    const hg = ctx.createRadialGradient(4, -29, 1, 2, -27, 8.5);
    hg.addColorStop(0, '#e8bb92'); hg.addColorStop(1, SKD);
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(2, -27, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1c12'; ctx.beginPath(); ctx.arc(2, -27, 7.7, Math.PI * 0.55, Math.PI * 1.2); ctx.lineTo(2, -27); ctx.fill();
    ctx.fillStyle = SKD; ctx.beginPath(); ctx.ellipse(-0.5, -26.5, 1.8, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SK; ctx.beginPath(); ctx.moveTo(9, -28); ctx.lineTo(11, -25); ctx.lineTo(8.6, -24.5); ctx.fill();
    ctx.fillStyle = '#1b1410'; ctx.beginPath(); ctx.arc(6.3, -28.4, 1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a1c12'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(4.8, -30.6); ctx.lineTo(8, -30.2); ctx.stroke();
    ctx.strokeStyle = '#7a4a34'; ctx.lineWidth = 1;
    ctx.beginPath();

    ctx.beginPath(); ctx.arc(2, -29.5, 7.9, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#21140a'; ctx.beginPath(); ctx.ellipse(10.5, -29.6, 6, 1.6, 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9a24a'; ctx.fillRect(1, -35.5, 3, 2.5);

  }

  function drawWheel(cx, cy) {
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2c2c2c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = '#262626';

    const rg = ctx.createRadialGradient(-2, -3, 1, 0, 0, 11);
    rg.addColorStop(0, '#f2f2f2'); rg.addColorStop(0.6, '#a5a5a5'); rg.addColorStop(1, '#4a4a4a');

    ctx.restore();
  }

  function drawTruck() {
    const bob = Math.sin(time * 22) * 0.8 + Math.sin(time * 7.3) * 0.5;
    // soft contact shadow on the road
    ctx.save(); ctx.translate(tx + 98, TRUCK_BASE + 1); ctx.scale(1, 0.06);
    const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 115);
    sg.addColorStop(0, 'rgba(0,0,0,0.55)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.fillRect(-115, -115, 230, 230); ctx.restore();
    const t = truckSprite;

  function drawGround() {
    const g = groundTile;
    const start = Math.floor((camX - 10) / GROUND_TILE) * GROUND_TILE;
    for (let x = start; x < camX + W + 10; x += GROUND_TILE) ctx.drawImage(g.c, x, GROUND + g.top, GROUND_TILE + 0.5, g.h);
  }

  function drawPrediction() {
    // faint guide arc for the first few houses
    const show = settingsOpen || (state === 'drive' && (cfg.guide === 'always' || (cfg.guide === 'first' && level <= 2)));
    if (!show || state === 'air' || state === 'result') return;
    const G = gravity();
    let x = tx + SUN_OX + PK_OX, y = DRIVER_Y + PK_OY, vx = (state === 'drive' ? speed : speedFor(0)) + launchVX(), vy = launchVY();
    ctx.fillStyle = settingsOpen ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.55)';
    const r = settingsOpen ? 3 : 2.2;
    let dist = 0;
    for (let i = 0; i < 600; i++) {
      const h = 1 / 240;
      const px = x, py = y;
      vy += G * h; x += vx * h; y += vy * h;
      if (y > GROUND) break;
      dist += Math.hypot(x - px, y - py);
      if (dist >= 16) { dist = 0; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.type === 'puff') {
        const s = p.size * (1 + (1 - a) * p.grow);
        ctx.globalAlpha = a * p.alpha;
        ctx.drawImage(p.sprite, p.x - s, p.y - s, s * 2, s * 2);
      } else if (p.type === 'glow') {
        ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(glowSprite, p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
        ctx.globalCompositeOperation = 'source-over';

        ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size * Math.abs(flip) + 0.6, p.size * 0.6);
        if (flip > 0.75) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size * Math.abs(flip) + 0.6, p.size * 0.6); }
        ctx.restore();
      } else if (p.type === 'debris') {
        ctx.globalAlpha = Math.min(1, a * 2);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size * 0.35, p.size, p.size * 0.7);
        ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(-p.size / 2, p.size * 0.2, p.size, p.size * 0.15);
        ctx.fillStyle = 'rgba(255,245,220,0.25)'; ctx.fillRect(-p.size / 2, -p.size * 0.35, p.size, p.size * 0.12);
        ctx.restore();
      } else if (p.type === 'peanut') {
        ctx.globalAlpha = Math.min(1, a * 2);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.4, p.size * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawTexts() {
    for (const t of texts) {
      const k = t.t / t.max;
      let s;
      if (t.t < 0.16) { const u = t.t / 0.16; s = 0.6 + u * 0.55; }
      else if (t.t < 0.28) s = 1.15 - (t.t - 0.16) / 0.12 * 0.15;
      else s = 1;
      ctx.save();
      ctx.globalAlpha = k > 0.72 ? 1 - (k - 0.72) / 0.28 : 1;
      ctx.translate(t.x, t.y - t.t * 26);
      ctx.rotate(t.rot);
      ctx.scale(s, s);
      ctx.font = `italic 900 ${t.size}px -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
      ctx.lineJoin = 'round'; ctx.lineWidth = t.size * 0.08; ctx.strokeStyle = 'rgba(20,16,10,0.85)';
      ctx.strokeText(t.text, 0, 0);
      ctx.shadowColor = 'transparent';
      const gr = ctx.createLinearGradient(0, -t.size / 2, 0, t.size / 2);
      if (t.color === '#ffffff') { gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#cfd3d8'); }
      else { gr.addColorStop(0, '#fff3c4'); gr.addColorStop(0.5, '#f2c14e'); gr.addColorStop(1, '#b07d1c'); }
      ctx.fillStyle = gr; ctx.fillText(t.text, 0, 0);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    const sx = shake ? rand(-shake, shake) * 0.5 : 0, sy = shake ? rand(-shake, shake) * 0.5 : 0;
    ctx.save();
    ctx.translate(sx, sy);
    drawSky();

    ctx.save();
    ctx.translate(-camX, 0);
    drawTrees();
    for (const h of houses) if (h.x - 40 < camX + W + 20 && h.x + h.w + 110 > camX - 20) drawHouse(h);
    drawGround();
    drawPrediction();
    if (driver.mode === 'truck' && state !== 'title' && state !== 'over') drawDriver(driver.x, driver.y, 0, 'truck');
    drawTruck();
    if (driver.mode === 'air') drawDriver(driver.x, driver.y, driver.rot, 'air');
    if (driver.mode === 'ragdoll') drawDriver(driver.x, driver.y, driver.rot, 'ragdoll');
    drawParticles();
    ctx.restore();

    drawTexts();
    ctx.restore();

    // warm grade + vignette
    ctx.fillStyle = 'rgba(255,200,140,0.05)'; ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.45, W / 2, H * 0.48, W * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  // ================= HUD =================
  const $score = document.getElementById('score'), $high = document.getElementById('high');
  const $combo = document.getElementById('combo'), $lives = document.getElementById('lives');
  const $hint = document.getElementById('hint'), $level = document.getElementById('level');
  const $overlay = document.getElementById('overlay');

  function updateHud() {
    $score.textContent = score;
    $high.textContent = high;
    $combo.textContent = streak > 1 ? `STREAK ×${Math.min(5, streak)}` : '';
    let l = '';
    for (let i = 0; i < 3; i++) l += `<div class="pkg${i >= lives ? ' lost' : ''}"></div>`;
    $lives.innerHTML = l;
    $level.textContent = state === 'title' ? '' : `HOUSE ${level + 1}  ·  ${Math.round(speed / MPH)} MPH`;
    $hint.innerHTML = isTouch
      ? '<b>Tap</b> to dunk · <b>hold</b> to float'
      : 'Press <b>Space</b> to dunk · <b>hold</b> to float · <b>S</b> settings';
  }

  function showOverlay(html) {
    $hint.style.display = html ? 'none' : '';
    if (!html) { $overlay.classList.add('hidden'); return; }
    $overlay.innerHTML = html;
    $overlay.classList.remove('hidden');
  }

  // ================= Input (keyboard + touch / pointer) =================
  // ---- Settings panel ----
  let settingsOpen = false;
  const $settings = document.getElementById('settings');
  const FMT = {
    startMph: v => v + ' mph', rampMph: v => '+' + v + ' mph', maxMph: v => v + ' mph',
    power: v => v + '%', angle: v => v + '°', gravity: v => v + '%', float: v => v + '%',
  };
  function saveCfg() { try { localStorage.setItem('slamDunkDeliverySettings', JSON.stringify(cfg)); } catch (e) {} }
  function syncSettings() {
    for (const k of Object.keys(FMT)) {
      document.getElementById('s-' + k).value = cfg[k];
      document.getElementById('v-' + k).textContent = FMT[k](cfg[k]);
    }
    document.querySelectorAll('#s-guide button').forEach(b => b.classList.toggle('on', b.dataset.v === cfg.guide));
  }
  function applyCfg() {
    if (state !== 'title' && state !== 'over') speed = speedFor(level);
    saveCfg(); syncSettings(); updateHud();
  }
  for (const k of Object.keys(FMT)) {
    document.getElementById('s-' + k).addEventListener('input', e => { cfg[k] = parseFloat(e.target.value); applyCfg(); });
  }
  document.querySelectorAll('#s-guide button').forEach(b => b.addEventListener('click', () => { cfg.guide = b.dataset.v; applyCfg(); }));
  document.getElementById('s-reset').addEventListener('click', () => { Object.assign(cfg, DEFAULTS); applyCfg(); });
  function openSettings(open) {
    settingsOpen = open;
    holding = false; activePointers.clear();
    $settings.classList.toggle('hidden', !open);
    wrap.classList.toggle('settings-open', open);
    if (open) syncSettings();
    last = performance.now();
  }
  document.getElementById('s-done').addEventListener('click', () => openSettings(false));
  document.getElementById('gear').addEventListener('click', () => { unlockAudio(); openSettings(!settingsOpen); });
  $settings.addEventListener('click', e => { if (e.target === $settings) openSettings(false); });
  const onUi = e => e.target && e.target.closest && e.target.closest('.ui');

  function press() {
    if (settingsOpen) return;
    unlockAudio();
    if (state === 'title') { start(); return; }
    if (state === 'over') { if (overT > 0.8) start(); return; }
    if (state === 'drive') launch();
    holding = true;
  }
  function release() { holding = false; }

  window.addEventListener('keydown', e => {
    if (e.code === 'Escape' || e.key === 's' || e.key === 'S') { openSettings(e.code === 'Escape' ? false : !settingsOpen); return; }
    if (settingsOpen) return;
    if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); release(); }
  });

  const activePointers = new Set();
  window.addEventListener('pointerdown', e => {
    if (onUi(e)) return;
    e.preventDefault();
    const first = activePointers.size === 0;
    activePointers.add(e.pointerId);
    if (first) press();
  }, { passive: false });
  const up = e => { activePointers.delete(e.pointerId); if (activePointers.size === 0) release(); };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  // block iOS Safari scroll / pinch / double-tap zoom / callouts
  ['touchstart', 'touchmove', 'touchend'].forEach(t => window.addEventListener(t, e => { if (!onUi(e)) e.preventDefault(); }, { passive: false }));
  ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu'].forEach(t => window.addEventListener(t, e => e.preventDefault()));
  window.addEventListener('blur', () => { activePointers.clear(); release(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { activePointers.clear(); release(); } });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));

  // ================= Main loop =================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!settingsOpen) update(dt);
    render();
    requestAnimationFrame(frame);
  }

  speed = speedFor(0);
  RS = 0;          // force static art build on first resize
  resize();
  resetWorld();
  updateHud();
  showOverlay(`
    <div class="kicker">THE NEIGHBORHOOD ROUTE</div>
    <h1>SLAM DUNK</h1>
    <h2>DELIVERY</h2>
    <p>Launch the driver out of the sunroof and dunk the package down the chimney, through the open window or into the driveway hoop.</p>
    <div class="small">Time your launch · hold to float · three missed deliveries ends the route</div>
    <div class="big">${isTouch ? 'TAP' : 'PRESS SPACE'} TO START</div>`);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
