  if (keys.left || keys.right || keys.jump || keys.down) clampEditorCam();
}

function resizeGrid(dw, dh) {
  const w = edW(), h = edH();
  const nw = Math.max(10, Math.min(250, w + dw)), nh = Math.max(8, Math.min(60, h + dh));
  if (nw === w && nh === h) return;
  pushUndo();
  let g = editor.grid.map((r) => (nw > w ? r.concat(Array(nw - w).fill(".")) : r.slice(0, nw)));
  // height changes happen at the top so the ground stays put
  if (nh > h) g = Array.from({ length: nh - h }, () => Array(nw).fill(".")).concat(g);
  else if (nh < h) g = g.slice(h - nh);
  editor.grid = g;
  saveCustom();
  updateSizeLabel();
  clampEditorCam();
}

function updateSizeLabel() {
  if (editor.grid) $("edSize").textContent = `${edW()}×${edH()}`;
}

function renderEditor() {
  const z = editor.zoom || 1;
  drawBackground(editor.cam.x, editor.cam.y, z);
  ctx.save();
  ctx.scale(z, z);
  ctx.translate(-editor.cam.x, -editor.cam.y);
  const gw = edW(), gh = edH();
  const x0 = Math.floor(editor.cam.x / T) - 1, x1 = Math.ceil((editor.cam.x + W / z) / T) + 1;
  const y0 = Math.floor(editor.cam.y / T) - 1, y1 = Math.ceil((editor.cam.y + H / z) / T) + 1;

  // level bounds + grid
  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 1 / z;
  ctx.beginPath();
  for (let x = Math.max(0, x0); x <= Math.min(gw, x1); x++) { ctx.moveTo(x * T, 0); ctx.lineTo(x * T, gh * T); }
  for (let y = Math.max(0, y0); y <= Math.min(gh, y1); y++) { ctx.moveTo(0, y * T); ctx.lineTo(gw * T, y * T); }
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.setLineDash([6, 6]);
  ctx.strokeRect(0, 0, gw * T, gh * T);
  ctx.setLineDash([]);

  const g = editor.grid;
  const solid = (x, y) => (x < 0 || x >= gw ? true : y < 0 || y >= gh ? false : g[y][x] === "#");
  drawTiles(g, gw, gh, x0, x1, y0, y1, solid, true);
  for (let y = Math.max(0, y0); y <= Math.min(gh - 1, y1); y++) {
    for (let x = Math.max(0, x0); x <= Math.min(gw - 1, x1); x++) {
      const c = g[y][x];
      if ("#^v:.".includes(c)) continue;
      if (c === "=" || c === "~") {
        if (x > 0 && g[y][x - 1] === c) continue;
        let len = 1;
        while (x + len < gw && g[y][x + len] === c) len++;
        drawPlatform(x * T, y * T, len * T, c === "~");
        continue;
      }
      drawGlyph(c, x * T, y * T, frameCount);
    }
  }

  if (editor.hover && editor.tool !== "pan" && !touchMode) {
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 2 / z;
    ctx.strokeRect(editor.hover.tx * T, editor.hover.ty * T, T, T);
  }
  ctx.restore();

  const v = editorView();
  text(touchMode ? "Paint with one finger · move with two" : "Click to paint · right-click erases · arrows or scroll to move",
    W / 2, v.bottom - 16, 12, "center", 0.55, "400");
}

const glyphPoses = {};
function glyphPose(c) {
  if (glyphPoses[c]) return glyphPoses[c];
  const e = { type: ENEMY_INFO[c].type, stun: 0, onGround: true, vx: 0, t: 0, phase: 0, state: "walk", st: 0 };
  if (c === "F") e.vx = 2.3, e.phase = 1;
  if (c === "g") e.vx = 1, e.phase = 2;
  return (glyphPoses[c] = enemyPose(e));
}

// Draw one map character at a tile (editor + palette icons)
function drawGlyph(c, px, py, time) {
  if (c === "#") {
    ctx.fillStyle = "#0d0d0d";
    ctx.fillRect(px, py, T, T);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, T - 2, T - 2);
  } else if (c === "^" || c === "v") drawSpike(px, py, c);
  else if (c === ":") drawStop(px, py);
  else if (c === "*") drawCoin(px + T / 2, py + T / 2, time);
  else if (c === "P") drawStick(px + T / 2, py + T, 1, makePose(), true, 1);
  else if (c === "E") drawDoor(px, py, time);
  else if (c === "C") drawCheck(px, py, 1, time);
  else if (c === "=") drawPlatform(px, py, T, false);
  else if (c === "~") drawPlatform(px, py, T, true);
  else if (c === "f") drawFlyer(px + T / 2, py + T / 2, -1, time, ENEMY_COLOR);
  else if (ENEMY_INFO[c]) {
    const s = drawStick(px + T / 2, py + T, -1, glyphPose(c), true, 1, ENEMY_COLOR);
    if (c === "F") {
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.head.x - 6, s.head.y - 1);
      ctx.lineTo(s.head.x + 6, s.head.y - 1);
      ctx.stroke();
    }
  } else if (c === ".") {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 8, py + 8); ctx.lineTo(px + T - 8, py + T - 8);
    ctx.moveTo(px + T - 8, py + 8); ctx.lineTo(px + 8, py + T - 8);
    ctx.stroke();
  } else if (c === "pan") {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    const cx = px + T / 2, cy = py + T / 2;
    ctx.beginPath();
    ctx.moveTo(cx - 11, cy); ctx.lineTo(cx + 11, cy);
    ctx.moveTo(cx, cy - 11); ctx.lineTo(cx, cy + 11);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      ctx.moveTo(cx + dx * 11 - dy * 4 - dx * 4, cy + dy * 11 - dx * 4 - dy * 4);
      ctx.lineTo(cx + dx * 11, cy + dy * 11);
      ctx.lineTo(cx + dx * 11 + dy * 4 - dx * 4, cy + dy * 11 + dx * 4 - dy * 4);
    }
    ctx.stroke();
  }
}

function buildPalette() {
  const pal = $("palette");
  pal.innerHTML = "";
  for (const t of TOOLS) {
    const b = document.createElement("button");
    b.className = "tool" + (editor.tool === t.ch ? " sel" : "");
    b.setAttribute("aria-label", t.name);
    const c = document.createElement("canvas");
    c.width = 72; c.height = 72;
    const g = c.getContext("2d");
    if (g) {
      const saved = ctx;
      ctx = g;
      g.fillStyle = "#000";
      g.fillRect(0, 0, 72, 72);
      g.scale(72 / (T * 1.5), 72 / (T * 1.5));
      g.translate(T * 0.25, T * 0.25 + (t.ch === "E" || t.ch === "C" ? T * 0.4 : 0));
      try { drawGlyph(t.ch, 0, 0, 0); } catch (_) { /* icons are decoration */ }
      ctx = saved;
    }
    const s = document.createElement("span");
    s.textContent = t.name;
    b.append(c, s);
    b.addEventListener("click", () => {
      editor.tool = t.ch;
      for (const el of pal.children) el.classList.remove("sel");
      b.classList.add("sel");
    });
    pal.append(b);
  }
}

// Share codes: run-length encoded rows, e.g. "SR1:40.:2.P36.E./40#"
function encodeLevel(grid) {
  return "SR1:" + grid.map((r) => r.join("").replace(/(.)\1*/g, (m) => (m.length > 1 ? m.length : "") + m[0])).join("/");
}

function decodeLevel(code) {
  const s = code.trim().replace(/\s+/g, "");
  if (!s.startsWith("SR1:")) throw new Error("A level code starts with SR1:");
  const rows = s.slice(4).split("/").map((r) => {
    let out = "";
    for (const m of r.matchAll(/(\d*)([^\d])/g)) out += m[2].repeat(m[1] ? Math.min(400, +m[1]) : 1);
    return out;
  });
  const valid = /^[.#^v*PECF=~:gfs]*$/;
  if (rows.length < 4 || rows.length > 60 || !rows.every((r) => valid.test(r)))
    throw new Error("That code is damaged. Copy the whole thing, starting at SR1:");
  const src = parseRows(rows);
  if (src.w > 250) throw new Error("That level is wider than 250 tiles.");
  return src.rows.map((r) => r.split(""));
}

// ===========================================================================
// DOM screens
// ===========================================================================
function showUI() {
  const inMenu = scene === "menu";
  $("menu").hidden = !inMenu;
  $("pauseBtn").hidden = scene !== "play";
  $("pauseMenu").hidden = scene !== "paused";
  $("btnToEditor").hidden = !(world && world.mode === "test");
  $("endMenu").hidden = !(scene === "win" || scene === "over");
  $("editorUI").hidden = scene !== "editor";
  if (scene === "over") $("btnAgain").textContent = "Fight Again";
  if (scene === "win") $("btnAgain").textContent = "Play Again";
  if (inMenu) {
    $("menuNote").textContent = touchMode
      ? "Tip: on iPad, tap Share → Add to Home Screen to play full screen."
      : "Move ← → / A D   Jump Space / W / ↑ (twice to double jump)   Dash Shift / X   Hit J / C   Pause P   Mute M";
    $("btnArena").textContent = arenaBest.wave ? `Arena · best wave ${arenaBest.wave}` : "Arena";
  }
}

function showMainMenu() {
  scene = "menu";
  world = null;
  clearEffects();
  $("mainButtons").hidden = false;
  $("levelPick").hidden = true;
  $("levelBack").hidden = true;
  showUI();
}

function showLevelPick() {
  const grid = $("levelGrid");
  grid.innerHTML = "";
  LEVELS.forEach((L, i) => {
    const b = document.createElement("button");
    const locked = i >= progress.unlocked;
    b.disabled = locked;
    b.innerHTML = `<span>${i + 1}</span><small></small>`;
    b.querySelector("small").textContent = locked ? "locked" : L.name;
    b.addEventListener("click", () => startStory(i));
    grid.append(b);
  });
  $("mainButtons").hidden = true;
  $("levelPick").hidden = false;
  $("levelBack").hidden = false;
  const open = Array.from(grid.querySelectorAll("button")).filter((b) => !b.disabled);
  if (open.length && !touchMode) open[open.length - 1].focus();
}

function pause() {
  if (scene !== "play") return;
  scene = "paused";
  for (const k in keys) keys[k] = false;
  showUI();
}
function resume() {
  scene = "play";
  showUI();
}

let toastTimer = 0;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

let modalAction = null;
function openModal(title, text, value, okLabel, onOk) {
  $("modalTitle").textContent = title;
  $("modalText").textContent = text;
  $("modalArea").value = value;
  $("modalOk").textContent = okLabel;
  modalAction = onOk;
  $("modal").hidden = false;
}
function closeModal() { $("modal").hidden = true; modalAction = null; }

function wireUI() {
  $("btnStory").addEventListener("click", showLevelPick);
  $("btnBack").addEventListener("click", showMainMenu);
  $("btnArena").addEventListener("click", startArena);
  $("btnEditor").addEventListener("click", openEditor);
  $("pauseBtn").addEventListener("click", pause);
  $("btnResume").addEventListener("click", resume);
  $("btnRestart").addEventListener("click", restartCurrent);
  $("btnToEditor").addEventListener("click", openEditor);
  $("btnQuit").addEventListener("click", showMainMenu);
  $("btnEndMenu").addEventListener("click", showMainMenu);
  $("btnAgain").addEventListener("click", () => (scene === "over" ? startArena() : startStory(0)));

  $("edMenu").addEventListener("click", showMainMenu);
  $("edUndo").addEventListener("click", editorUndo);
  $("edClear").addEventListener("click", () => {
    pushUndo();
    editor.grid = parseRows(DEFAULT_CUSTOM).rows.map((r) => r.split(""));
    saveCustom();
    updateSizeLabel();
    openEditor();
    toast("Cleared. Undo brings it back.");
  });
  $("edWm").addEventListener("click", () => resizeGrid(-5, 0));
  $("edWp").addEventListener("click", () => resizeGrid(5, 0));
  $("edHm").addEventListener("click", () => resizeGrid(0, -2));
  $("edHp").addEventListener("click", () => resizeGrid(0, 2));
  $("edZm").addEventListener("click", () => { editor.zoom = Math.max(0.3, editor.zoom / 1.25); clampEditorCam(); });
  $("edZp").addEventListener("click", () => { editor.zoom = Math.min(2.5, editor.zoom * 1.25); clampEditorCam(); });
  $("edPlay").addEventListener("click", () => {
    const flat = editor.grid.map((r) => r.join("")).join("");
    if (!flat.includes("P")) { toast("Place a Start first"); return; }
    if (!flat.includes("E")) toast("No exit yet. Pause to get back.");
    startTest();
  });
  $("edShare").addEventListener("click", () => {
    const code = encodeLevel(editor.grid);
    openModal("Share level", "Send this code to a friend. They paste it with Load in their editor.", code, "Copy", () => {
      const area = $("modalArea");
      const fallback = () => { area.focus(); area.select(); toast("Selected. Copy it with ⌘C or Ctrl+C"); };
      try {
        navigator.clipboard.writeText(code).then(() => { toast("Code copied"); closeModal(); }, fallback);
      } catch (_) { fallback(); }
    });
  });
  $("edLoad").addEventListener("click", () => {
    openModal("Load level", "Paste a level code (it starts with SR1:). This replaces the level in the editor; Undo brings it back.", "", "Load", () => {
      try {
        const g = decodeLevel($("modalArea").value);
        pushUndo();
        editor.grid = g;
        saveCustom();
        closeModal();
        openEditor();
        toast("Level loaded");
      } catch (err) {
        $("modalText").textContent = err.message;
      }
    });
  });
  $("modalOk").addEventListener("click", () => modalAction && modalAction());
  $("modalCancel").addEventListener("click", closeModal);
  buildPalette();
}

// ===========================================================================
// Main loop (fixed 60 Hz simulation, render every animation frame)
// ===========================================================================
let frameCount = 0;
let last = performance.now();
let acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= STEP) {
    step();
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

function boot() {
  resize();
  loadCustom();
  wireUI();
  showMainMenu();
  requestAnimationFrame(frame);
}
boot();
</script>
